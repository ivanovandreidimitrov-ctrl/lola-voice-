<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>🧭 Lola Voice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a1628; --card: #142844; --accent: #ff6b35;
      --accent-glow: rgba(255,107,53,0.3); --green: #4caf50;
      --red: #f44336; --blue: #2196f3; --text: #e8e8e8;
      --text-dim: #8a8a8a; --border: #1e3a5f;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh; height: 100dvh; overflow: hidden; position: fixed; width: 100%;
      display: flex; flex-direction: column;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 12px; background: var(--card);
      border-bottom: 1px solid var(--border); flex: 0 0 auto;
    }
    .header-title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; }
    .status-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase;
    }
    .status-off { background: rgba(244,67,54,0.2); color: var(--red); border: 1px solid var(--red); }
    .status-on { background: rgba(76,175,80,0.2); color: var(--green); border: 1px solid var(--green); animation: pulse-green 2s infinite; }
    .status-listening { background: rgba(255,107,53,0.2); color: var(--accent); border: 1px solid var(--accent); animation: pulse-orange 1s infinite; }
    .status-thinking { background: rgba(33,150,243,0.2); color: var(--blue); border: 1px solid var(--blue); }
    .status-speaking { background: rgba(33,150,243,0.2); color: var(--blue); border: 1px solid var(--blue); animation: pulse-blue 1s infinite; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    @keyframes pulse-green { 0%,100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); } 50% { box-shadow: 0 0 0 8px rgba(76,175,80,0); } }
    @keyframes pulse-orange { 0%,100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.4); } 50% { box-shadow: 0 0 0 12px rgba(255,107,53,0); } }
    @keyframes pulse-blue { 0%,100% { box-shadow: 0 0 0 0 rgba(33,150,243,0.4); } 50% { box-shadow: 0 0 0 8px rgba(33,150,243,0); } }
    .voice-orb { border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid; transition: all 0.3s; }
    .voice-orb.idle { border-color: var(--text-dim); }
    .voice-orb.listening { border-color: var(--accent); background: rgba(255,107,53,0.1); box-shadow: 0 0 40px var(--accent-glow); animation: orb-pulse 1.5s infinite; }
    .voice-orb.thinking { border-color: var(--blue); background: rgba(33,150,243,0.1); box-shadow: 0 0 30px rgba(33,150,243,0.3); }
    .voice-orb.speaking { border-color: var(--blue); background: rgba(33,150,243,0.1); box-shadow: 0 0 30px rgba(33,150,243,0.3); animation: orb-pulse 1s infinite; }
    .voice-orb.on { border-color: var(--green); background: rgba(76,175,80,0.1); }
    .voice-orb.waking { border-color: var(--green); background: rgba(76,175,80,0.2); box-shadow: 0 0 30px rgba(76,175,80,0.4); animation: orb-pulse 1s infinite; }
    @keyframes orb-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .voice-status-text { font-size: 12px; color: var(--text-dim); text-align: center; min-height: 16px; }
    .voice-transcript {
      width: 100%; padding: 4px 12px; background: var(--card);
      border: 1px solid var(--border); font-size: 13px;
      line-height: 1.4; display: none; max-height: 60px; overflow-y: auto; flex: 0 0 auto;
    }
    .voice-transcript.visible { display: block; }
    .voice-response {
      width: 100%; padding: 4px 12px; background: rgba(33,150,243,0.1);
      border: 1px solid var(--blue); font-size: 13px;
      line-height: 1.4; display: none; max-height: 80px; overflow-y: auto; flex: 0 0 auto;
    }
    .voice-response.visible { display: block; }
    .response-label { font-size: 11px; color: var(--blue); margin-bottom: 4px; font-weight: 600; }
    .chat-log {
      width: 100%; flex: 1 1 auto; overflow-y: auto; padding: 8px 16px;
      display: flex; flex-direction: column; gap: 8px; min-height: 100px !important;
      background: rgba(255,255,255,0.02);
    }
    .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; animation: slide-in 0.3s ease; }
    @keyframes slide-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .chat-bubble.user { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
    .chat-bubble.lola { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .chat-bubble .timestamp { font-size: 10px; opacity: 0.6; margin-top: 4px; }
    .chat-bubble.pending { align-self: flex-end; background: rgba(255,165,0,0.15); color: #ffa500; border: 1px dashed #ffa500; border-bottom-right-radius: 4px; }
    .chat-bubble.pending .timestamp::after { content: ' \23F3 PENDING'; color: #ffa500; font-weight: 600; }
    .settings-panel {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; padding: 20px;
    }
    .settings-panel.visible { display: flex; }
    .settings-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; }
    .settings-card h2 { font-size: 20px; margin-bottom: 16px; }
    .settings-field { margin-bottom: 16px; }
    .settings-field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
    .settings-field input, .settings-field select { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; }
    .settings-field input:focus { outline: none; border-color: var(--accent); }
    .settings-buttons { display: flex; gap: 12px; margin-top: 20px; }
    .btn { flex: 1; padding: 10px 16px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .settings-icon { cursor: pointer; font-size: 20px; opacity: 0.7; }
    .power-bar { padding: 4px 12px; flex: 0 0 auto; }
    .power-bar-button {
      padding: 6px 14px; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .power-bar-button.off { background: rgba(244,67,54,0.15); color: var(--red); border: 1px solid var(--red); }
    .power-bar-button.on { background: rgba(76,175,80,0.2); color: var(--green); border: 1px solid var(--green); box-shadow: 0 0 15px rgba(76,175,80,0.2); }
    .power-bar-button:active { transform: scale(0.98); }
    .wake-hint { font-size: 11px; color: var(--text-dim); text-align: center; padding: 2px 6px; background: rgba(255,255,255,0.05); border-radius: 6px; max-width: 95%; }
    .wake-hint.active { color: var(--green); background: rgba(76,175,80,0.1); }
    .wake-hint.listening { color: var(--accent); background: rgba(255,107,53,0.1); }
    .debug-log { font-size: 10px; color: var(--text-dim); padding: 2px 12px; max-height: 40px; overflow-y: auto; flex: 0 0 auto; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">🧭 Lola Voice <span style="font-size:10px; color:var(--text-dim); font-weight:400;">v5.0</span></div>
    <div class="status-badge status-off" id="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">DECONECTAT</span>
    </div>
    <div class="settings-icon" onclick="toggleSettings()">⚙️</div>
  </div>

  <div class="power-bar" style="display:flex; align-items:center; gap:8px; padding:4px 12px;">
    <button class="power-bar-button off" id="power-button" onclick="togglePower()" style="width:auto; flex:0 0 auto; padding:6px 14px;">⏻ OFF</button>
    <div class="voice-orb idle" id="voice-orb" style="width:32px; height:32px; font-size:16px; border-width:2px; flex-shrink:0;">🧭</div>
    <div class="voice-status-text" id="voice-status" style="flex:1; text-align:left; font-size:11px;">Apasă ON</div>
    <div class="wake-hint" id="wake-hint" style="display:none; flex:0 0 auto; max-width:none; padding:2px 8px; font-size:10px;">Spune "Hey Lola"</div>
  </div>

  <div class="voice-transcript" id="transcript" style="padding:4px 12px; max-height:40px;"></div>
  <div class="voice-response" id="response" style="padding:4px 12px; max-height:50px;">
    <div class="response-label" style="font-size:10px;">🧭 LOLA:</div>
    <div id="response-text" style="font-size:12px;"></div>
  </div>

  <div class="chat-log" id="chat-log" style="min-height:50vh;"></div>

  <div class="debug-log" id="debug-log"></div>

  <div class="text-input-bar" style="display:flex; gap:8px; padding:6px 12px; background:var(--card); border-top:1px solid var(--border); flex-shrink:0;">
    <input type="text" id="text-input" placeholder="Scrie mesaj..." style="flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:8px 12px; color:var(--text); font-size:14px; outline:none;">
    <button id="text-send" onclick="sendTextMessage()" style="background:var(--accent); color:#fff; border:none; border-radius:10px; padding:8px 14px; font-size:14px; cursor:pointer; font-weight:600; flex-shrink:0;">➤</button>
  </div>

  <div class="settings-panel" id="settings-panel">
    <div class="settings-card">
      <h2>⚙️ Setări</h2>
      <div class="settings-field">
        <label for="gateway-url">Gateway URL (HTTPS Tailscale)</label>
        <input type="url" id="gateway-url" placeholder="https://desktop-iohktkv.tail18ed74.ts.net">
      </div>
      <div class="settings-field">
        <label for="gateway-token">Gateway Token</label>
        <input type="password" id="gateway-token" placeholder="Token autentificare">
      </div>
      <div class="settings-field">
        <label for="wake-word">Wake Word</label>
        <input type="text" id="wake-word" value="hey lola">
      </div>
      <div class="settings-field">
        <label for="tts-voice">Voce Răspuns (TTS)</label>
        <select id="tts-voice">
          <option value="auto">Auto (limba telefonului)</option>
          <option value="ro-RO">Română</option>
          <option value="it-IT">Italiană</option>
        </select>
      </div>
      <div class="settings-buttons">
        <button class="btn btn-secondary" onclick="toggleSettings()">Anulează</button>
        <button class="btn btn-primary" onclick="saveSettings()">Salvează</button>
      </div>
    </div>
  </div>

  <script>
    // === Config ===
    const GATEWAY_KEY = 'lola_gateway_url';
    const TOKEN_KEY = 'lola_gateway_token';
    const WAKE_KEY = 'lola_wake_word';
    const TTS_KEY = 'lola_tts_voice';

    let gatewayUrl = localStorage.getItem(GATEWAY_KEY) || '';
    let gatewayToken = localStorage.getItem(TOKEN_KEY) || '';
    let wakeWord = localStorage.getItem(WAKE_KEY) || 'hey lola';
    let ttsVoice = localStorage.getItem(TTS_KEY) || 'auto';

    document.getElementById('gateway-url').value = gatewayUrl;
    document.getElementById('gateway-token').value = gatewayToken;
    document.getElementById('wake-word').value = wakeWord;
    document.getElementById('tts-voice').value = ttsVoice;

    // === State ===
    let isOn = false, isConnected = false, isListening = false, isThinking = false, isSpeaking = false;
    let isWakeListening = false;
    let wakeRecognition = null;
    let ws = null, wsReconnectTimer = null, messageQueue = [];
    let wakeRestartTimer = null;
    let wakeRestartCount = 0;
    let mediaRecorder = null;
    let audioChunks = [];
    let mediaStream = null;
    let recordingTimer = null;

    // === OpenClaw Gateway protocol ===
    const SESSION_KEY = localStorage.getItem('lola_session_key') || 'agent:main:telegram:direct:8135678824';
    let streamedText = '';
    let subscribed = false;
    let rpcCounter = 0;

    const client = {
      pending: new Map(),
      request(method, params) {
        const id = (crypto.randomUUID ? crypto.randomUUID() : 'r' + (++rpcCounter));
        return new Promise((resolve, reject) => {
          client.pending.set(id, { resolve, reject });
          sendFrame({ type: 'req', id, method, params });
        });
      }
    };

    function sendFrame(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
    }

    function connectParams() {
      return {
        minProtocol: 4, maxProtocol: 4,
        client: { id: 'openclaw-control-ui', version: '3.1.0', platform: 'web', mode: 'webchat' },
        role: 'operator',
        scopes: ['operator.read', 'operator.write'],
        caps: ['tool-events'],
        auth: gatewayToken ? { token: gatewayToken } : undefined,
        locale: navigator.language || 'ro-RO',
        userAgent: navigator.userAgent
      };
    }

    // === Debug log ===
    function dbg(msg) {
      console.log('[LolaVoice] ' + msg);
      const el = document.getElementById('debug-log');
      if (el) {
        const time = new Date().toLocaleTimeString('ro-RO', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
        el.textContent = time + ' ' + msg;
      }
    }

    // === UI ===
    function setStatus(status, text) {
      const badge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      const orb = document.getElementById('voice-orb');
      const voiceStatus = document.getElementById('voice-status');
      badge.className = 'status-badge status-' + status;
      statusText.textContent = text;
      orb.className = 'voice-orb ' + (status === 'off' ? 'idle' : status);
      voiceStatus.textContent = text === 'DECONECTAT' ? 'Apasă ON pentru a conecta' : text;
    }

    function toggleSettings() { document.getElementById('settings-panel').classList.toggle('visible'); }

    function saveSettings() {
      gatewayUrl = document.getElementById('gateway-url').value.trim().replace(/\/$/, '');
      gatewayToken = document.getElementById('gateway-token').value.trim();
      wakeWord = document.getElementById('wake-word').value.trim().toLowerCase();
      ttsVoice = document.getElementById('tts-voice').value;
      localStorage.setItem(GATEWAY_KEY, gatewayUrl);
      localStorage.setItem(TOKEN_KEY, gatewayToken);
      localStorage.setItem(WAKE_KEY, wakeWord);
      localStorage.setItem(TTS_KEY, ttsVoice);
      toggleSettings();
      document.getElementById('voice-status').textContent = 'Salvat: URL=' + (gatewayUrl ? 'OK' : 'GOL') + ' Token=' + (gatewayToken ? 'OK' : 'GOL');
      if (isOn) { powerOff(); setTimeout(() => powerOn(), 500); }
    }

    function addChatBubble(text, sender) {
      const log = document.getElementById('chat-log');
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble ' + (sender === 'user' ? 'user' : 'lola');
      const time = new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
      bubble.innerHTML = text + '<div class="timestamp">' + time + '</div>';
      log.appendChild(bubble);
      log.scrollTop = log.scrollHeight;
      while (log.children.length > 50) log.removeChild(log.firstChild);
      return bubble;
    }

    // === Power ===
    async function togglePower() { if (isOn) powerOff(); else await powerOn(); }

    async function powerOn() {
      gatewayUrl = localStorage.getItem(GATEWAY_KEY) || gatewayUrl || '';
      gatewayToken = localStorage.getItem(TOKEN_KEY) || gatewayToken || '';
      if (!gatewayUrl) {
        document.getElementById('voice-status').textContent = 'EROARE: Gateway URL lipsește! Pune-l în setări ⚙️';
        toggleSettings();
        return;
      }
      isOn = true;
      document.getElementById('power-button').classList.add('on');
      document.getElementById('power-button').classList.remove('off');
      document.getElementById('power-button').textContent = '⏻ ON';
      document.getElementById('wake-hint').style.display = 'block';
      setStatus('on', 'CONECTARE...');
      connectWebSocket();
    }

    function powerOff() {
      isOn = false; isConnected = false; isListening = false; isThinking = false; isSpeaking = false;
      isWakeListening = false; subscribed = false; streamedText = '';
      document.getElementById('power-button').classList.remove('on');
      document.getElementById('power-button').classList.add('off');
      document.getElementById('power-button').textContent = '⏻ OFF';
      document.getElementById('wake-hint').style.display = 'none';
      document.getElementById('wake-hint').classList.remove('active', 'listening');
      stopWakeWord();
      stopRecording();
      disconnectWebSocket();
      stopSpeaking();
      setStatus('off', 'DECONECTAT');
      document.getElementById('transcript').classList.remove('visible');
      document.getElementById('response').classList.remove('visible');
    }

    // === WebSocket ===
    function connectWebSocket() {
      disconnectWebSocket();
      const wsUrl = gatewayUrl.replace(/^https:\/\//, 'wss://').replace(/^http:\/\//, 'ws://');
      dbg('WS connect: ' + wsUrl);
      try { ws = new WebSocket(wsUrl); } catch (e) { setStatus('off', 'DECONECTAT'); isOn = false; return; }

      ws.onopen = async () => {
        dbg('WS open — handshake...');
        setStatus('on', 'CONECTARE...');
        try {
          const hello = await client.request('connect', connectParams());
          if (!hello || hello.type !== 'hello-ok') throw new Error('hello-ok lipsa');
          dbg('hello-ok protocol=' + hello.protocol);
          isConnected = true;
          setStatus('on', 'CONECTAT');
          document.getElementById('wake-hint').classList.add('active');
          startWakeWord();

          try {
            await client.request('chat.history', { sessionKey: SESSION_KEY });
            await client.request('sessions.messages.subscribe', { key: SESSION_KEY });
            subscribed = true;
            dbg('subscribed OK: ' + SESSION_KEY);
          } catch (e) {
            dbg('subscribe err: ' + e.message);
          }

          while (messageQueue.length > 0) { ws.send(JSON.stringify(messageQueue.shift())); }
        } catch (e) {
          dbg('connect err: ' + e.message);
          isConnected = false;
          setStatus('off', 'AUTENTIFICARE EȘUATĂ');
        }
      };

      ws.onmessage = (event) => { try { handleWsMessage(JSON.parse(event.data)); } catch (e) {} };
      ws.onerror = () => { dbg('WS error'); };
      ws.onclose = () => {
        dbg('WS closed');
        isConnected = false;
        if (isOn) { setStatus('on', 'RECONECTARE...'); wsReconnectTimer = setTimeout(() => connectWebSocket(), 3000); }
        else setStatus('off', 'DECONECTAT');
      };
    }

    function disconnectWebSocket() {
      if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
      if (ws) { ws.onclose = null; ws.onerror = null; ws.onmessage = null; ws.onopen = null; try { ws.close(); } catch(e){} ws = null; }
      subscribed = false;
      if (client.pending.size) { for (const p of client.pending.values()) p.reject(new Error('ws disconnected')); client.pending.clear(); }
    }

    function sendWsMessage(msg) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg)); else messageQueue.push(msg); }

    function handleWsMessage(data) {
      if (!data || typeof data.type !== 'string') return;
      if (data.type === 'res') {
        const p = client.pending.get(data.id); if (!p) return; client.pending.delete(data.id);
        if (data.ok) p.resolve(data.payload); else p.reject(new Error((data.error && data.error.message) || 'request failed'));
        return;
      }
      if (data.type === 'event') {
        if (data.event === 'connect.challenge') return;
        if (data.event === 'chat') { handleChatEvent(data.payload); return; }
        return;
      }
    }

    function handleChatEvent(p) {
      if (!p) return;
      if (p.sessionKey && p.sessionKey !== SESSION_KEY) return;
      const state = p.state;

      if (state === 'delta') {
        if (p.replace) streamedText = p.deltaText || '';
        else streamedText += (p.deltaText || '');
        if (streamedText) {
          document.getElementById('response-text').textContent = streamedText;
          document.getElementById('response').classList.add('visible');
        }
        return;
      }

      if (state === 'final') {
        let text = streamedText;
        try {
          if (p.message && Array.isArray(p.message.content)) {
            const joined = p.message.content.map(b => (b && b.text) || '').join('');
            if (joined) text = joined;
          } else if (p.message && typeof p.message.content === 'string') { text = p.message.content; }
        } catch (e) {}
        streamedText = '';

        // Filtrează NO_REPLY
        let displayText = text;
        if (displayText && displayText.trim() === 'NO_REPLY') {
          isThinking = false;
          if (isConnected && !isListening) setStatus('on', 'CONECTAT');
          if (isOn) startWakeWord();
          return;
        }
        if (displayText) displayText = displayText.replace(/\s*NO_REPLY\s*/g, '').trim();
        if (displayText) {
          addChatBubble(displayText, 'lola');
          document.getElementById('response-text').textContent = displayText;
          document.getElementById('response').classList.add('visible');
          isThinking = false;
          speakResponse(displayText);
        } else {
          isThinking = false;
          if (isConnected && !isListening) setStatus('on', 'CONECTAT');
          if (isOn) startWakeWord();
        }
        return;
      }

      if (state === 'aborted' || state === 'error') {
        streamedText = ''; isThinking = false;
        dbg('chat ' + state + ': ' + (p.errorMessage || ''));
        if (isConnected && !isListening) setStatus('on', 'CONECTAT');
        if (isOn) startWakeWord();
        return;
      }
    }

    function sendTextToGateway(text) {
      isThinking = true;
      stopRecording();
      streamedText = '';
      setStatus('thinking', 'PROCESEZ...');
      var pendingBubble = addChatBubble(text, 'user');
      pendingBubble.classList.add('pending');

      var pendingTimeout = setTimeout(function() {
        if (isThinking) {
          isThinking = false;
          if (isConnected && !isListening) setStatus('on', 'CONECTAT');
          if (isOn) startWakeWord();
        }
      }, 15000);

      client.request('chat.send', { sessionKey: SESSION_KEY, message: text, idempotencyKey: (crypto.randomUUID ? crypto.randomUUID() : 'k' + (++rpcCounter)) })
        .then((ack) => { clearTimeout(pendingTimeout); pendingBubble.classList.remove('pending'); dbg('ack: ' + (ack && ack.status)); })
        .catch((e) => {
          clearTimeout(pendingTimeout); isThinking = false;
          if (isConnected && !isListening) setStatus('on', 'CONECTAT');
          addChatBubble('⚠️ EROARE: ' + (e.message || 'eroare gateway'), 'lola');
          dbg('send err: ' + e.message);
          if (isOn) startWakeWord();
        });
    }

    function sendTextMessage() {
      const input = document.getElementById('text-input');
      const text = input.value.trim();
      if (!text || !isConnected) return;
      input.value = '';
      sendTextToGateway(text);
    }
    document.addEventListener('DOMContentLoaded', function() {
      const ti = document.getElementById('text-input');
      if (ti) ti.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendTextMessage(); });
    });

    // ==========================================
    // === WAKE WORD (varianta A — SpeechRecognition cu repornire agresivă) ===
    // ==========================================
    // Strategie: SpeechRecognition ascultă continuu cu continuous=true.
    // Pe Android Chrome se oprește singur după ~30-60s sau la erori.
    // Repornim automat la onend/onerror cu backoff scurt (200ms-1s).
    // Când detectează wake word → oprim wake → pornim înregistrare MediaRecorder.

    function startWakeWord() {
      if (isWakeListening) return;
      if (isListening || isThinking || isSpeaking) return;
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { dbg('SpeechRecognition nu există — fallback la tap'); return; }

      try {
        wakeRecognition = new SR();
      } catch(e) { dbg('SR create err: ' + e.message); return; }

      wakeRecognition.continuous = true;
      wakeRecognition.interimResults = true;
      wakeRecognition.lang = 'ro-RO';
      wakeRecognition.maxAlternatives = 3;

      wakeRecognition.onstart = () => {
        isWakeListening = true;
        wakeRestartCount = 0;
        dbg('WAKE pornit — ascult "Hey Lola"');
        const orb = document.getElementById('voice-orb');
        if (orb) orb.className = 'voice-orb on';
        const hint = document.getElementById('wake-hint');
        if (hint) { hint.classList.add('active'); hint.classList.remove('listening'); hint.textContent = 'Spune "Hey Lola"'; }
      };

      wakeRecognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          let transcript = event.results[i][0].transcript.toLowerCase().trim();
          // Variante: "hey lola", "hei lola", "hai lola", "he lola", "ei lola"
          const variants = [wakeWord, 'hei lola', 'hai lola', 'he lola', 'ei lola', 'heila', 'hej lola'];
          let matched = false;
          for (const v of variants) {
            if (transcript.includes(v)) { matched = true; break; }
          }
          if (matched && !isListening && !isThinking && !isSpeaking) {
            dbg('WAKE WORD detectată: "' + transcript + '"');
            stopWakeWord();
            // Feedback: vibrează + bip
            if (navigator.vibrate) navigator.vibrate(100);
            startRecording();
            return;
          }
        }
      };

      wakeRecognition.onerror = (e) => {
        dbg('WAKE err: ' + e.error);
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          dbg('Microfon blocat — necesită permisiune');
          document.getElementById('voice-status').textContent = '⚠️ Microfon blocat — permite accesul';
          return;
        }
        // no-speech, audio-capture, network — repornim
        if (e.error === 'no-speech' || e.error === 'aborted' || e.error === 'audio-capture') return; // onend va reporni
      };

      wakeRecognition.onend = () => {
        isWakeListening = false;
        dbg('WAKE ended (count=' + wakeRestartCount + ')');
        if (isOn && !isListening && !isThinking && !isSpeaking) {
          // Repornire agresivă cu backoff
          const delay = Math.min(200 * Math.pow(1.5, wakeRestartCount), 2000);
          wakeRestartCount++;
          if (wakeRestartTimer) clearTimeout(wakeRestartTimer);
          wakeRestartTimer = setTimeout(() => {
            if (isOn && !isListening && !isThinking && !isSpeaking && !isWakeListening) {
              try { wakeRecognition.start(); } catch(e) { dbg('WAKE restart err: ' + e.message); }
            }
          }, delay);
        }
      };

      try {
        wakeRecognition.start();
        dbg('WAKE start...');
      } catch(e) {
        dbg('WAKE start err: ' + e.message);
        // Retry după 500ms
        if (wakeRestartTimer) clearTimeout(wakeRestartTimer);
        wakeRestartTimer = setTimeout(() => { if (isOn) startWakeWord(); }, 500);
      }
    }

    function stopWakeWord() {
      isWakeListening = false;
      if (wakeRestartTimer) { clearTimeout(wakeRestartTimer); wakeRestartTimer = null; }
      if (wakeRecognition) {
        try { wakeRecognition.onend = null; wakeRecognition.onerror = null; wakeRecognition.onresult = null; wakeRecognition.stop(); } catch(e){}
        wakeRecognition = null;
      }
      dbg('WAKE oprit');
    }

    // ==========================================
    // === ÎNREGISTRARE + GROQ WHISPER (varianta B) ===
    // ==========================================
    // După wake word → MediaRecorder captează audio (max 15s).
    // Audio → base64 → trimite prin Gateway ca atașament audio.
    // Gateway folosește Groq Whisper pentru transcriere.
    // Textul transcris → chat.send → Lola procesează → răspuns TTS.

    async function startRecording() {
      isListening = true;
      setStatus('listening', 'ASCULT...');
      const hint = document.getElementById('wake-hint');
      if (hint) { hint.classList.remove('active'); hint.classList.add('listening'); hint.textContent = '🔊 Vorbește...'; }
      dbg('REC start — MediaRecorder');

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];

        // Preferăm webm/opus, fallback la default
        let mimeType = 'audio/webm;codecs=opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/webm';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';

        mediaRecorder = new MediaRecorder(mediaStream, mimeType ? { mimeType } : {});
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

        mediaRecorder.onstop = async () => {
          dbg('REC stop — procesare audio');
          const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }

          if (audioBlob.size < 500) {
            dbg('Audio prea mic — ignor');
            stopListening();
            if (isOn) startWakeWord();
            return;
          }

          // Arată transcript placeholder
          const transcriptEl = document.getElementById('transcript');
          transcriptEl.textContent = '🔄 Transcriu audio...';
          transcriptEl.classList.add('visible');

          // Trimite audio ca mesaj către Gateway (chat.send cu atașament audio)
          const reader = new FileReader();
          reader.onloadend = () => {
            const base64 = reader.result.split(',')[1];
            const dataSizeKB = Math.round(base64.length * 0.75 / 1024);
            dbg('Audio: ' + dataSizeKB + 'KB, trimitem prin WS');

            // Trimite audio prin chat.send ca atașament
            // OpenClaw Gateway suportă atașamente în mesaje
            const msgId = crypto.randomUUID ? crypto.randomUUID() : 'k' + (++rpcCounter);
            sendWsMessage({
              type: 'req',
              id: msgId,
              method: 'chat.send',
              params: {
                sessionKey: SESSION_KEY,
                message: '🎤 [audio]',
                idempotencyKey: msgId,
                attachments: [{
                  type: 'audio',
                  media: 'data:' + (mediaRecorder.mimeType || 'audio/webm') + ';base64,' + base64,
                  mimeType: mediaRecorder.mimeType || 'audio/webm'
                }]
              }
            });

            // Așteptăm răspuns — vom primi event chat cu transcrierea + răspuns
            isThinking = true;
            setStatus('thinking', 'PROCESEZ...');
            transcriptEl.textContent = '⏳ Aștept răspuns...';
          };
          reader.readAsDataURL(audioBlob);
        };

        // Auto-stop după 15s
        recordingTimer = setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            dbg('REC timeout 15s — auto stop');
            mediaRecorder.stop();
          }
        }, 15000);

        mediaRecorder.start();
        dbg('REC pornit OK');

        // Permite oprire manuală prin tap pe orb
        const orb = document.getElementById('voice-orb');
        orb.onclick = () => {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            dbg('REC stop manual');
            mediaRecorder.stop();
          }
        };
      } catch(e) {
        dbg('REC err: ' + e.message);
        document.getElementById('voice-status').textContent = '⚠️ Microfon: ' + e.message;
        stopListening();
        if (isOn) startWakeWord();
      }
    }

    function stopListening() {
      isListening = false;
      if (recordingTimer) { clearTimeout(recordingTimer); recordingTimer = null; }
      // Nu oprim mediaRecorder aici — onstop face cleanup
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try { mediaRecorder.stop(); } catch(e) {}
      }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      stopListening();
    }

    // === TTS ===
    function speakResponse(text) {
      isSpeaking = true; isThinking = false;
      setStatus('speaking', 'VORBESC...');
      dbg('TTS: "' + text.substring(0, 50) + (text.length > 50 ? '...' : '') + '"');

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = ttsVoice === 'auto' ? (navigator.language || 'ro-RO') : ttsVoice;
        const voices = window.speechSynthesis.getVoices();
        const matchVoice = voices.find(v => v.lang === utterance.lang) || voices.find(v => v.lang.startsWith(utterance.lang.split('-')[0]));
        if (matchVoice) utterance.voice = matchVoice;
        utterance.rate = 1.05; utterance.pitch = 1.0;
        utterance.onend = () => { dbg('TTS ended'); stopSpeaking(); if (isOn) startWakeWord(); };
        utterance.onerror = (e) => { dbg('TTS err: ' + e.error); stopSpeaking(); if (isOn) startWakeWord(); };
        window.speechSynthesis.speak(utterance);
      } else {
        dbg('speechSynthesis nu există');
        stopSpeaking();
        if (isOn) startWakeWord();
      }
    }

    function stopSpeaking() {
      isSpeaking = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (isConnected && !isListening && !isThinking) setStatus('on', 'CONECTAT');
    }

    // === Service Worker ===
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(e => dbg('SW err: ' + e));
    }

    // === Init ===
    if (!gatewayUrl) toggleSettings();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => dbg('Voices: ' + window.speechSynthesis.getVoices().length);
      // Unele browsere necesită un utterance gol pentru a încărca vocile
      window.speechSynthesis.getVoices();
    }
  </script>
</body>

<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>🧭 Lola Voice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a1628; --card: #142844; --accent: #ff6b35;
      --accent-glow: rgba(255,107,53,0.3); --green: #4caf50;
      --red: #f44336; --blue: #2196f3; --text: #e8e8e8;
      --text-dim: #8a8a8a; --border: #1e3a5f;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: var(--card);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .header-title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; }
    .status-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase;
    }
    .status-off { background: rgba(244,67,54,0.2); color: var(--red); border: 1px solid var(--red); }
    .status-on { background: rgba(76,175,80,0.2); color: var(--green); border: 1px solid var(--green); animation: pulse-green 2s infinite; }
    .status-listening { background: rgba(255,107,53,0.2); color: var(--accent); border: 1px solid var(--accent); animation: pulse-orange 1s infinite; }
    .status-thinking { background: rgba(33,150,243,0.2); color: var(--blue); border: 1px solid var(--blue); }
    .status-speaking { background: rgba(33,150,243,0.2); color: var(--blue); border: 1px solid var(--blue); animation: pulse-blue 1s infinite; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    @keyframes pulse-green { 0%,100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); } 50% { box-shadow: 0 0 0 8px rgba(76,175,80,0); } }
    @keyframes pulse-orange { 0%,100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.4); } 50% { box-shadow: 0 0 0 12px rgba(255,107,53,0); } }
    @keyframes pulse-blue { 0%,100% { box-shadow: 0 0 0 0 rgba(33,150,243,0.4); } 50% { box-shadow: 0 0 0 8px rgba(33,150,243,0); } }
    /* .main removed — merged into power-bar row */
    .voice-orb.idle { border-color: var(--text-dim); }
    .voice-orb.listening { border-color: var(--accent); background: rgba(255,107,53,0.1); box-shadow: 0 0 40px var(--accent-glow); animation: orb-pulse 1.5s infinite; }
    .voice-orb.thinking { border-color: var(--blue); background: rgba(33,150,243,0.1); box-shadow: 0 0 30px rgba(33,150,243,0.3); }
    .voice-orb.speaking { border-color: var(--blue); background: rgba(33,150,243,0.1); box-shadow: 0 0 30px rgba(33,150,243,0.3); animation: orb-pulse 1s infinite; }
    .voice-orb.on { border-color: var(--green); background: rgba(76,175,80,0.1); }
    @keyframes orb-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .voice-status-text { font-size: 12px; color: var(--text-dim); text-align: center; min-height: 16px; }
    .voice-transcript {
      max-width: 95%; padding: 6px 10px; background: var(--card);
      border-radius: 12px; border: 1px solid var(--border); font-size: 13px;
      line-height: 1.4; display: none; max-height: 60px; overflow-y: auto;
    }
    .voice-transcript.visible { display: block; }
    .voice-response {
      max-width: 95%; padding: 6px 10px; background: rgba(33,150,243,0.1);
      border-radius: 12px; border: 1px solid var(--blue); font-size: 13px;
      line-height: 1.4; display: none; max-height: 80px; overflow-y: auto;
    }
    .voice-response.visible { display: block; }
    .response-label { font-size: 11px; color: var(--blue); margin-bottom: 4px; font-weight: 600; }
    .power-button {
      width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--red);
      background: rgba(244,67,54,0.1); color: var(--red); font-size: 32px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: all 0.3s ease; flex-shrink: 0;
    }
    .power-button.on { border-color: var(--green); background: rgba(76,175,80,0.2); color: var(--green); box-shadow: 0 0 20px rgba(76,175,80,0.3); }
    .power-button:active { transform: scale(0.95); }
    .power-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .chat-log {
      width: 100%; flex: 1 1 0; overflow-y: auto; padding: 8px 16px;
      display: flex; flex-direction: column; gap: 8px; min-height: 0;
    }
    .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; animation: slide-in 0.3s ease; }
    @keyframes slide-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .chat-bubble.user { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
    .chat-bubble.lola { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .chat-bubble .timestamp { font-size: 10px; opacity: 0.6; margin-top: 4px; }
    .chat-bubble.pending { align-self: flex-end; background: rgba(255,165,0,0.15); color: #ffa500; border: 1px dashed #ffa500; border-bottom-right-radius: 4px; }
    .chat-bubble.pending .timestamp::after { content: ' \23F3 PENDING'; color: #ffa500; font-weight: 600; }
    .settings-panel {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; padding: 20px;
    }
    .settings-panel.visible { display: flex; }
    .settings-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; }
    .settings-card h2 { font-size: 20px; margin-bottom: 16px; }
    .settings-field { margin-bottom: 16px; }
    .settings-field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
    .settings-field input { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; }
    .settings-field input:focus { outline: none; border-color: var(--accent); }
    .settings-buttons { display: flex; gap: 12px; margin-top: 20px; }
    .btn { flex: 1; padding: 10px 16px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .settings-icon { cursor: pointer; font-size: 20px; opacity: 0.7; }
    .power-bar { padding: 4px 12px; flex-shrink: 0; }
    .power-bar-button {
      padding: 6px 14px; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .power-bar-button.off { background: rgba(244,67,54,0.15); color: var(--red); border: 1px solid var(--red); }
    .power-bar-button.on { background: rgba(76,175,80,0.2); color: var(--green); border: 1px solid var(--green); box-shadow: 0 0 15px rgba(76,175,80,0.2); }
    .power-bar-button:active { transform: scale(0.98); }
    .footer { padding: 4px 16px; text-align: center; font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
    .wake-hint { font-size: 11px; color: var(--text-dim); text-align: center; padding: 2px 6px; background: rgba(255,255,255,0.05); border-radius: 6px; max-width: 95%; }
    .wake-hint.active { color: var(--green); background: rgba(76,175,80,0.1); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">🧭 Lola Voice</div>
    <div class="status-badge status-off" id="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">DECONECTAT</span>
    </div>
    <div class="settings-icon" onclick="toggleSettings()">⚙️</div>
  </div>

  <div class="power-bar" style="display:flex; align-items:center; gap:8px; padding:4px 12px;">
    <button class="power-bar-button off" id="power-button" onclick="togglePower()" style="width:auto; flex:0 0 auto; padding:6px 14px;">⏻ OFF</button>
    <div class="voice-orb idle" id="voice-orb" style="width:32px; height:32px; font-size:16px; border-width:2px; flex-shrink:0;">🧭</div>
    <div class="voice-status-text" id="voice-status" style="flex:1; text-align:left; font-size:11px;">Apasă ON</div>
    <div class="wake-hint" id="wake-hint" style="display:none; flex:0 0 auto; max-width:none; padding:2px 8px; font-size:10px;">Spune "Hey Lola"</div>
  </div>

  <div class="voice-transcript" id="transcript" style="padding:4px 12px; max-height:40px;"></div>
  <div class="voice-response" id="response" style="padding:4px 12px; max-height:50px;">
    <div class="response-label" style="font-size:10px;">🧭 LOLA:</div>
    <div id="response-text" style="font-size:12px;"></div>
  </div>

  <div class="chat-log" id="chat-log"></div>

  <div class="text-input-bar" style="display:flex; gap:8px; padding:6px 12px; background:var(--card); border-top:1px solid var(--border); flex-shrink:0;">
    <input type="text" id="text-input" placeholder="Scrie mesaj..." style="flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:8px 12px; color:var(--text); font-size:14px; outline:none;">
    <button id="text-send" onclick="sendTextMessage()" style="background:var(--accent); color:#fff; border:none; border-radius:10px; padding:8px 14px; font-size:14px; cursor:pointer; font-weight:600; flex-shrink:0;">➤</button>
  </div>

  <div class="footer" style="padding:2px 16px;">
    <div>🧭 Lola Voice v3.4</div>
  </div>

  <div class="settings-panel" id="settings-panel">
    <div class="settings-card">
      <h2>⚙️ Setări</h2>
      <div class="settings-field">
        <label for="gateway-url">Gateway URL (HTTPS Tailscale)</label>
        <input type="url" id="gateway-url" placeholder="https://desktop-iohktkv.tail18ed74.ts.net">
      </div>
      <div class="settings-field">
        <label for="gateway-token">Gateway Token</label>
        <input type="password" id="gateway-token" placeholder="Token autentificare">
      </div>
      <div class="settings-field">
        <label for="wake-word">Wake Word</label>
        <input type="text" id="wake-word" value="hey lola">
      </div>
      <div class="settings-field">
        <label for="tts-voice">Voce Răspuns (TTS)</label>
        <select id="tts-voice" style="width:100%; padding:10px 12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:15px;">
          <option value="auto">Auto (limba telefonului)</option>
          <option value="ro-RO">Română</option>
          <option value="it-IT">Italiană</option>
        </select>
      </div>
      <div class="settings-buttons">
        <button class="btn btn-secondary" onclick="toggleSettings()">Anulează</button>
        <button class="btn btn-primary" onclick="saveSettings()">Salvează</button>
      </div>
    </div>
  </div>

  <script>
    // === Config ===
    const GATEWAY_KEY = 'lola_gateway_url';
    const TOKEN_KEY = 'lola_gateway_token';
    const WAKE_KEY = 'lola_wake_word';
    const TTS_KEY = 'lola_tts_voice';

    let gatewayUrl = localStorage.getItem(GATEWAY_KEY) || '';
    let gatewayToken = localStorage.getItem(TOKEN_KEY) || '';
    let wakeWord = localStorage.getItem(WAKE_KEY) || 'hey lola';
    let ttsVoice = localStorage.getItem(TTS_KEY) || 'auto';

    document.getElementById('gateway-url').value = gatewayUrl;
    document.getElementById('gateway-token').value = gatewayToken;
    document.getElementById('wake-word').value = wakeWord;
    document.getElementById('tts-voice').value = ttsVoice;

    // === State ===
    let isOn = false, isConnected = false, isListening = false, isThinking = false, isSpeaking = false;
    let recognition = null, wakeRecognition = null;
    let ws = null, wsReconnectTimer = null, messageQueue = [];
    let pendingResponseResolve = null;

    // === OpenClaw Gateway protocol state ===
    // Protocolul NU e JSON-RPC 2.0, ci un protocol propriu cu 3 tipuri de frame:
    //   req:    {type:"req", id, method, params}
    //   res:    {type:"res", id, ok, payload?|error?}
    //   event:  {type:"event", event, payload, seq?}
    // Handshake: dupa WS open se trimite un req method "connect" (auth la params.auth.token);
    //   raspuns hello-ok. Apoi subscriere la sessions.messages.subscribe.
    // Mesajele abonate sosesc ca event "chat" cu payload.state: delta|final|aborted|error.
    const SESSION_KEY = localStorage.getItem('lola_session_key') || 'agent:main:telegram:direct:8135678824';
    let streamedText = '';   // text asistant acumulat din delta event-uri
    let subscribed = false;  // sesiunea e abonata la messages.subscribe
    let rpcCounter = 0;      // fallback id generator daca crypto.randomUUID lipseste

    // Client shim cu API .request(method, params) ca in Control UI-ul oficial.
    const client = {
      pending: new Map(), // id -> {resolve, reject}
      request(method, params) {
        const id = (crypto.randomUUID ? crypto.randomUUID() : 'r' + (++rpcCounter));
        return new Promise((resolve, reject) => {
          client.pending.set(id, { resolve, reject });
          sendFrame({ type: 'req', id, method, params });
        });
      }
    };

    // Trimite un frame JSON doar daca WS e deschis (pentru req-uri; nu le coada).
    function sendFrame(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
    }

    // Parametri pentru handshake-ul "connect" (identitate: webchat-ui).
    function connectParams() {
      return {
        minProtocol: 4,
        maxProtocol: 4,
        client: {
          id: 'openclaw-control-ui',
          version: '3.1.0',
          platform: 'web',
          mode: 'webchat'
        },
        role: 'operator',
        scopes: ['operator.read', 'operator.write'],
        caps: ['tool-events'],
        auth: gatewayToken ? { token: gatewayToken } : undefined,
        locale: navigator.language || 'ro-RO',
        userAgent: navigator.userAgent
      };
    }

    // === UI ===
    function setStatus(status, text) {
      const badge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      const orb = document.getElementById('voice-orb');
      const voiceStatus = document.getElementById('voice-status');
      badge.className = 'status-badge status-' + status;
      statusText.textContent = text;
      orb.className = 'voice-orb ' + (status === 'off' ? 'idle' : status);
      voiceStatus.textContent = text === 'DECONECTAT' ? 'Apasă ON pentru a conecta' : text;
    }

    function toggleSettings() { document.getElementById('settings-panel').classList.toggle('visible'); }

    function saveSettings() {
      gatewayUrl = document.getElementById('gateway-url').value.trim().replace(/\/$/, '');
      gatewayToken = document.getElementById('gateway-token').value.trim();
      wakeWord = document.getElementById('wake-word').value.trim().toLowerCase();
      ttsVoice = document.getElementById('tts-voice').value;
      localStorage.setItem(GATEWAY_KEY, gatewayUrl);
      localStorage.setItem(TOKEN_KEY, gatewayToken);
      localStorage.setItem(WAKE_KEY, wakeWord);
      localStorage.setItem(TTS_KEY, ttsVoice);
      toggleSettings();
      // DEBUG: arată pe ecran ce s-a salvat
      document.getElementById('voice-status').textContent = 'Salvat: URL=' + (gatewayUrl ? 'OK' : 'GOL') + ' Token=' + (gatewayToken ? 'OK' : 'GOL');
      if (isOn) { powerOff(); setTimeout(() => powerOn(), 500); }
    }

    function addChatBubble(text, sender) {
      const log = document.getElementById('chat-log');
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble ' + (sender === 'user' ? 'user' : 'lola');
      const time = new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
      bubble.innerHTML = text + '<div class="timestamp">' + time + '</div>';
      log.appendChild(bubble);
      log.scrollTop = log.scrollHeight;
      while (log.children.length > 50) log.removeChild(log.firstChild);
      return bubble;
    }

    // === Power ===
    async function togglePower() { if (isOn) powerOff(); else await powerOn(); }

    async function powerOn() {
      // Re-citește din localStorage în caz că a fost salvat
      gatewayUrl = localStorage.getItem(GATEWAY_KEY) || gatewayUrl || '';
      gatewayToken = localStorage.getItem(TOKEN_KEY) || gatewayToken || '';
      if (!gatewayUrl) {
        document.getElementById('voice-status').textContent = 'EROARE: Gateway URL lipsește! Pune-l în setări ⚙️';
        toggleSettings();
        return;
      }
      isOn = true;
      document.getElementById('power-button').classList.add('on');
      document.getElementById('power-button').classList.remove('off');
      document.getElementById('power-button').textContent = '⏻ ON';
      document.getElementById('wake-hint').style.display = 'block';
      setStatus('on', 'CONECTARE...');
      connectWebSocket();
    }

    function powerOff() {
      isOn = false; isConnected = false; isListening = false; isThinking = false; isSpeaking = false;
      subscribed = false; streamedText = '';
      document.getElementById('power-button').classList.remove('on');
      document.getElementById('power-button').classList.add('off');
      document.getElementById('power-button').textContent = '⏻ OFF';
      document.getElementById('wake-hint').style.display = 'none';
      document.getElementById('wake-hint').classList.remove('active');
      stopWakeWordDetection();
      disconnectWebSocket();
      stopSpeaking();
      setStatus('off', 'DECONECTAT');
      document.getElementById('transcript').classList.remove('visible');
      document.getElementById('response').classList.remove('visible');
    }

    // === WebSocket ===
    function connectWebSocket() {
      disconnectWebSocket();
      // Convert HTTPS to WSS. Auth NU se pune pe subprotocol/query —
      // se trimite in frame-ul "connect" dupa deschiderea WS (params.auth.token).
      const wsUrl = gatewayUrl.replace(/^https:\/\//, 'wss://').replace(/^http:\/\//, 'ws://');
      console.log('Connecting to:', wsUrl);

      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        setStatus('off', 'DECONECTAT'); isOn = false; return;
      }

      ws.onopen = async () => {
        console.log('WebSocket connected — handshake connect...');
        setStatus('on', 'CONECTARE...');
        try {
          // 1) Handshake: req method "connect" (auth la params.auth.token)
          const hello = await client.request('connect', connectParams());
          if (!hello || hello.type !== 'hello-ok') {
            throw new Error('hello-ok lipsa');
          }
          console.log('hello-ok, protocol', hello.protocol, 'connId', hello.server && hello.server.connId);
          document.getElementById('voice-status').textContent = 'Handshake OK! Protocol: ' + (hello.protocol || 'ok');
          isConnected = true;
          setStatus('on', 'CONECTAT');
          document.getElementById('wake-hint').classList.add('active');
          startWakeWordDetection();

          // 2) Subscriere la mesajele sesiunii (sosesc ca event "chat")
          // Protocol oficial: chat.history pentru istoric + sessions.messages.subscribe pentru evenimente live
          try {
            await client.request('chat.history', { sessionKey: SESSION_KEY });
            await client.request('sessions.messages.subscribe', { key: SESSION_KEY });
            subscribed = true;
            console.log('subscribed to chat history + events for session', SESSION_KEY);
          } catch (e) {
            console.log('history/subscribe failed:', e.message);
            document.getElementById('voice-status').textContent = 'EROARE subscribe: ' + e.message;
          }

          // 3) Flush texte trimise inainte de connect (si cadre audio fallback raw)
          while (messageQueue.length > 0) {
            const msg = messageQueue.shift();
            ws.send(JSON.stringify(msg));
          }
        } catch (e) {
          console.log('connect failed:', e.message);
          isConnected = false;
          setStatus('off', 'AUTENTIFICARE EȘUATĂ');
          document.getElementById('voice-status').textContent = 'EROARE connect: ' + e.message;
        }
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleWsMessage(data);
        } catch (e) {
          console.log('WS parse error:', e);
        }
      };

      ws.onerror = (e) => {
        console.log('WS error:', e);
      };

      ws.onclose = () => {
        console.log('WebSocket closed');
        isConnected = false;
        if (isOn) {
          setStatus('on', 'RECONECTARE...');
          wsReconnectTimer = setTimeout(() => connectWebSocket(), 3000);
        } else {
          setStatus('off', 'DECONECTAT');
        }
      };
    }

    function disconnectWebSocket() {
      if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
      if (ws) {
        ws.onclose = null; ws.onerror = null; ws.onmessage = null; ws.onopen = null;
        try { ws.close(); } catch (e) {}
        ws = null;
      }
      // Respinge req-uri inca pending (altfel ar atarna pana la timeout infinit).
      subscribed = false;
      if (client.pending.size) {
        for (const p of client.pending.values()) p.reject(new Error('ws disconnected'));
        client.pending.clear();
      }
    }

    function sendWsMessage(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      } else {
        messageQueue.push(msg);
      }
    }

    function handleWsMessage(data) {
      // OpenClaw Gateway protocol: frame-uri discriminate dupa "type".
      if (!data || typeof data.type !== 'string') {
        console.log('Non-protocol frame:', data);
        return;
      }

      // Raspuns la un req: rezolva promise-ul pending dupa id.
      if (data.type === 'res') {
        const p = client.pending.get(data.id);
        if (!p) return;
        client.pending.delete(data.id);
        if (data.ok) p.resolve(data.payload);
        else p.reject(new Error((data.error && data.error.message) || ('request failed: ' + (data.error && data.error.code || 'unknown'))));
        return;
      }

      // Event (notificare server). Mesajele abonate sosesc ca event "chat".
      if (data.type === 'event') {
        if (data.event === 'connect.challenge') {
          // Fara device identity — ignoram nonce-ul (conectam cu usedFallback).
          return;
        }
        if (data.event === 'chat') {
          handleChatEvent(data.payload);
          return;
        }
        // Alte event-uri (tool, session, etc.) — nu afecteaza UI-ul de voce.
        return;
      }

      console.log('Unhandled frame type:', data);
    }

    // Proceseaza un event "chat" (payload cu state: delta|final|aborted|error).
    function handleChatEvent(p) {
      if (!p) return;
      const state = p.state;

      if (state === 'delta') {
        // deltaText: text incremental; replace:true inseamna refresh complet (nu append).
        if (p.replace) streamedText = p.deltaText || '';
        else streamedText += (p.deltaText || '');
        if (streamedText) {
          document.getElementById('response-text').textContent = streamedText;
          document.getElementById('response').classList.add('visible');
        }
        return;
      }

      if (state === 'final') {
        // Mesajul final: folosim continutul canonic din p.message.content (array de {type:"text", text}).
        let text = streamedText;
        try {
          if (p.message && Array.isArray(p.message.content)) {
            const joined = p.message.content.map(b => (b && b.text) || '').join('');
            if (joined) text = joined;
          } else if (p.message && typeof p.message.content === 'string') {
            text = p.message.content;
          }
        } catch (e) {}
        streamedText = '';
        if (text && text.trim()) {
          addChatBubble(text, 'lola');
          document.getElementById('response-text').textContent = text;
          document.getElementById('response').classList.add('visible');
          isThinking = false;
          speakResponse(text);
        } else {
          isThinking = false;
          if (isConnected && !isListening) setStatus('on', 'CONECTAT');
          if (isOn) startWakeWordDetection();
        }
        return;
      }

      if (state === 'aborted' || state === 'error') {
        streamedText = '';
        isThinking = false;
        console.log('chat', state, p.errorMessage || '');
        if (isConnected && !isListening) setStatus('on', 'CONECTAT');
        if (isOn) startWakeWordDetection();
        return;
      }
    }

    function sendTextToGateway(text) {
      isThinking = true;
      stopListening();
      streamedText = '';
      setStatus('thinking', 'PROCESEZ...');

      // Adaugă mesajul utilizatorului în istoric
      var pendingBubble = addChatBubble(text, 'user');
      pendingBubble.classList.add('pending');

      // Timeout: după 10 secunde fără răspuns, marcăm ca pending
      var pendingTimeout = setTimeout(function() {
        if (isThinking) {
          isThinking = false;
          if (isConnected && !isListening) setStatus('on', 'CONECTAT');
          document.getElementById('voice-status').textContent = 'Mesaj în pending ⏳ - aștept răspuns gateway';
          if (isOn) startWakeWordDetection();
        }
      }, 10000);

      client.request('chat.send', { sessionKey: SESSION_KEY, message: text, idempotencyKey: (crypto.randomUUID ? crypto.randomUUID() : 'k' + (++rpcCounter)) })
        .then((ack) => {
          clearTimeout(pendingTimeout);
          console.log('chat.send ack:', ack && ack.status, ack && ack.runId);
          pendingBubble.classList.remove('pending');
          document.getElementById('voice-status').textContent = 'Trimis OK: ' + (ack && ack.status || 'ack');
        })
        .catch((e) => {
          clearTimeout(pendingTimeout);
          isThinking = false;
          if (isConnected && !isListening) setStatus('on', 'CONECTAT');
          addChatBubble('⚠️ EROARE: ' + (e.message || 'eroare gateway'), 'lola');
          document.getElementById('voice-status').textContent = 'EROARE: ' + (e.message || 'unknown');
          if (isOn) startWakeWordDetection();
        });
    }

    // === Text Input ===
    function sendTextMessage() {
      const input = document.getElementById('text-input');
      const text = input.value.trim();
      if (!text || !isConnected) return;
      input.value = '';
      sendTextToGateway(text);
    }
    document.addEventListener('DOMContentLoaded', function() {
      const ti = document.getElementById('text-input');
      if (ti) ti.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendTextMessage(); });
    });

    // === Wake Word ===
    function startWakeWordDetection() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { console.log('SpeechRecognition not available'); return; }
      wakeRecognition = new SR();
      wakeRecognition.continuous = true;
      wakeRecognition.interimResults = true;
      wakeRecognition.lang = 'ro-RO';
      wakeRecognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript.toLowerCase().trim();
          if (transcript.includes(wakeWord) && !isListening && !isThinking && !isSpeaking) {
            wakeRecognition.stop();
            startListening();
            return;
          }
        }
      };
      wakeRecognition.onerror = (e) => {
        if (e.error === 'no-speech' || e.error === 'aborted') return;
        if (isOn && !isListening) {
          setTimeout(() => { if (isOn && !isListening && !isThinking && !isSpeaking) { try { wakeRecognition.start(); } catch(e) {} } }, 1000);
        }
      };
      wakeRecognition.onend = () => {
        if (isOn && !isListening && !isThinking && !isSpeaking) {
          setTimeout(() => { try { wakeRecognition.start(); } catch(e) {} }, 100);
        }
      };
      try { wakeRecognition.start(); } catch(e) {}
    }

    function stopWakeWordDetection() {
      if (wakeRecognition) { try { wakeRecognition.stop(); } catch(e) {} wakeRecognition = null; }
    }

    // === Listening ===
    function startListening() {
      isListening = true;
      setStatus('listening', 'ASCULT...');
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { startMediaRecording(); return; }
      recognition = new SR();
      recognition.lang = 'ro-RO'; recognition.continuous = false; recognition.interimResults = true;
      let finalTranscript = '';
      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalTranscript += t; else interim += t;
        }
        const transcriptEl = document.getElementById('transcript');
        transcriptEl.textContent = finalTranscript + interim;
        transcriptEl.classList.add('visible');
      };
      recognition.onerror = (e) => { stopListening(); if (isOn) startWakeWordDetection(); };
      recognition.onend = () => {
        if (finalTranscript.trim()) {
          addChatBubble(finalTranscript.trim(), 'user');
          sendTextToGateway(finalTranscript.trim());
        } else { stopListening(); if (isOn) startWakeWordDetection(); }
      };
      try { recognition.start(); } catch(e) { stopListening(); if (isOn) startWakeWordDetection(); }
    }

    function stopListening() {
      isListening = false;
      if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
    }

    // === Media Recording Fallback ===
    async function startMediaRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mediaRecorder = new MediaRecorder(stream);
        let audioChunks = [];
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          stream.getTracks().forEach(t => t.stop());
          if (audioBlob.size > 1000) {
            // Send as base64 audio through WebSocket
            const reader = new FileReader();
            reader.onloadend = () => {
              const base64 = reader.result.split(',')[1];
              sendWsMessage({ type: 'audio', audio: base64, format: 'webm', session: 'pwa-voice' });
              isThinking = true;
              setStatus('thinking', 'PROCESEZ...');
            };
            reader.readAsDataURL(audioBlob);
          } else { stopListening(); if (isOn) startWakeWordDetection(); }
        };
        setTimeout(() => { if (mediaRecorder.state !== 'inactive') mediaRecorder.stop(); }, 30000);
        mediaRecorder.start();
      } catch(e) { stopListening(); if (isOn) startWakeWordDetection(); }
    }

    // === TTS ===
    function speakResponse(text) {
      isSpeaking = true; isThinking = false;
      setStatus('speaking', 'VORBESC...');
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = ttsVoice === 'auto' ? (navigator.language || 'ro-RO') : ttsVoice;
        const voices = window.speechSynthesis.getVoices();
        const matchVoice = voices.find(v => v.lang === utterance.lang) || voices.find(v => v.lang.startsWith(utterance.lang.split('-')[0]));
        if (matchVoice) utterance.voice = matchVoice;
        utterance.rate = 1.0; utterance.pitch = 1.0;
        utterance.onend = () => { stopSpeaking(); if (isOn) startWakeWordDetection(); };
        utterance.onerror = () => { stopSpeaking(); if (isOn) startWakeWordDetection(); };
        window.speechSynthesis.speak(utterance);
      } else { stopSpeaking(); if (isOn) startWakeWordDetection(); }
    }

    function stopSpeaking() {
      isSpeaking = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (isConnected && !isListening && !isThinking) setStatus('on', 'CONECTAT');
    }

    // === Service Worker ===
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(e => console.log('SW error:', e));
    }

    // === Init ===
    if (!gatewayUrl) toggleSettings();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => console.log('Voices loaded:', window.speechSynthesis.getVoices().length);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>🧭 Lola Voice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0a1628;
      --card: #142844;
      --accent: #ff6b35;
      --accent-glow: rgba(255, 107, 53, 0.3);
      --green: #4caf50;
      --red: #f44336;
      --blue: #2196f3;
      --text: #e8e8e8;
      --text-dim: #8a8a8a;
      --border: #1e3a5f;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* === Header === */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 600;
    }
    
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .status-off {
      background: rgba(244, 67, 54, 0.2);
      color: var(--red);
      border: 1px solid var(--red);
    }
    
    .status-on {
      background: rgba(76, 175, 80, 0.2);
      color: var(--green);
      border: 1px solid var(--green);
      animation: pulse-green 2s infinite;
    }
    
    .status-listening {
      background: rgba(255, 107, 53, 0.2);
      color: var(--accent);
      border: 1px solid var(--accent);
      animation: pulse-orange 1s infinite;
    }
    
    .status-thinking {
      background: rgba(33, 150, 243, 0.2);
      color: var(--blue);
      border: 1px solid var(--blue);
    }
    
    .status-speaking {
      background: rgba(33, 150, 243, 0.2);
      color: var(--blue);
      border: 1px solid var(--blue);
      animation: pulse-blue 1s infinite;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    
    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(76, 175, 80, 0); }
    }
    
    @keyframes pulse-orange {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.4); }
      50% { box-shadow: 0 0 0 12px rgba(255, 107, 53, 0); }
    }
    
    @keyframes pulse-blue {
      0%, 100% { box-shadow: 0 0 0 0 rgba(33, 150, 243, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(33, 150, 243, 0); }
    }
    
    /* === Main Area === */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 24px;
      overflow: hidden;
    }
    
    /* === Voice Orb === */
    .voice-orb {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: var(--card);
      border: 3px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      transition: all 0.3s ease;
      position: relative;
    }
    
    .voice-orb.idle {
      border-color: var(--text-dim);
    }
    
    .voice-orb.listening {
      border-color: var(--accent);
      background: rgba(255, 107, 53, 0.1);
      box-shadow: 0 0 40px var(--accent-glow);
      animation: orb-pulse 1.5s infinite;
    }
    
    .voice-orb.thinking {
      border-color: var(--blue);
      background: rgba(33, 150, 243, 0.1);
      box-shadow: 0 0 30px rgba(33, 150, 243, 0.3);
    }
    
    .voice-orb.speaking {
      border-color: var(--blue);
      background: rgba(33, 150, 243, 0.1);
      box-shadow: 0 0 30px rgba(33, 150, 243, 0.3);
      animation: orb-pulse 1s infinite;
    }
    
    .voice-orb.on {
      border-color: var(--green);
      background: rgba(76, 175, 80, 0.1);
    }
    
    @keyframes orb-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .voice-status-text {
      font-size: 16px;
      color: var(--text-dim);
      text-align: center;
      min-height: 24px;
    }
    
    .voice-transcript {
      max-width: 90%;
      padding: 12px 16px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      font-size: 15px;
      line-height: 1.5;
      display: none;
      max-height: 120px;
      overflow-y: auto;
    }
    
    .voice-transcript.visible {
      display: block;
    }
    
    .voice-response {
      max-width: 90%;
      padding: 12px 16px;
      background: rgba(33, 150, 243, 0.1);
      border-radius: 16px;
      border: 1px solid var(--blue);
      font-size: 15px;
      line-height: 1.5;
      display: none;
      max-height: 150px;
      overflow-y: auto;
    }
    
    .voice-response.visible {
      display: block;
    }
    
    .response-label {
      font-size: 11px;
      color: var(--blue);
      margin-bottom: 4px;
      font-weight: 600;
    }
    
    /* === ON/OFF Button === */
    .power-button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--red);
      background: rgba(244, 67, 54, 0.1);
      color: var(--red);
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }
    
    .power-button.on {
      border-color: var(--green);
      background: rgba(76, 175, 80, 0.2);
      color: var(--green);
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
    }
    
    .power-button:active {
      transform: scale(0.95);
    }
    
    .power-label {
      font-size: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    /* === Chat Log === */
    .chat-log {
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    
    .chat-bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      animation: slide-in 0.3s ease;
    }
    
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .chat-bubble.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    
    .chat-bubble.lola {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    
    .chat-bubble .timestamp {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 4px;
    }
    
    /* === Settings Panel === */
    .settings-panel {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .settings-panel.visible {
      display: flex;
    }
    
    .settings-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
    }
    
    .settings-card h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }
    
    .settings-field {
      margin-bottom: 16px;
    }
    
    .settings-field label {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    
    .settings-field input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
    }
    
    .settings-field input:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .settings-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    
    .btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    
    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }
    
    .settings-icon {
      cursor: pointer;
      font-size: 20px;
      opacity: 0.7;
    }
    
    /* === Footer === */
    .footer {
      padding: 8px 16px;
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    
    /* === Wake word indicator === */
    .wake-hint {
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      max-width: 90%;
    }
    
    .wake-hint.active {
      color: var(--green);
      background: rgba(76, 175, 80, 0.1);
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-title">🧭 Lola Voice</div>
    <div class="status-badge status-off" id="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">DECONECTAT</span>
    </div>
    <div class="settings-icon" onclick="toggleSettings()">⚙️</div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Voice Orb -->
    <div class="voice-orb idle" id="voice-orb">
      🧭
    </div>
    
    <div class="voice-status-text" id="voice-status">Apasă ON pentru a conecta</div>
    
    <!-- Wake word hint -->
    <div class="wake-hint" id="wake-hint" style="display:none">
      Spune <strong>"Hey Lola"</strong> pentru a începe
    </div>
    
    <!-- Transcript -->
    <div class="voice-transcript" id="transcript"></div>
    
    <!-- Response -->
    <div class="voice-response" id="response">
      <div class="response-label">🧭 LOLA:</div>
      <div id="response-text"></div>
    </div>
  </div>

  <!-- Chat Log -->
  <div class="chat-log" id="chat-log"></div>

  <!-- Footer with Power Button -->
  <div class="footer">
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px">
      <div class="power-button" id="power-button" onclick="togglePower()">
        ⏻
      </div>
      <div class="power-label" id="power-label">OFF</div>
    </div>
    <div>🧭 Lola Voice v2.0</div>
  </div>

  <!-- Settings -->
  <div class="settings-panel" id="settings-panel">
    <div class="settings-card">
      <h2>⚙️ Setări</h2>
      <div class="settings-field">
        <label for="gateway-url">Gateway URL (Tailscale IP)</label>
        <input type="url" id="gateway-url" placeholder="https://100.x.x.x:18789">
      </div>
      <div class="settings-field">
        <label for="gateway-token">Gateway Token</label>
        <input type="password" id="gateway-token" placeholder="Token autentificare">
      </div>
      <div class="settings-field">
        <label for="wake-word">Wake Word</label>
        <input type="text" id="wake-word" value="hey lola">
      </div>
      <div class="settings-field">
        <label for="tts-voice">Voce Răspuns (TTS)</label>
        <select id="tts-voice" style="width:100%; padding:10px 12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:15px;">
          <option value="auto">Auto (limba telefonului)</option>
          <option value="ro-RO">Română</option>
          <option value="it-IT">Italiană</option>
        </select>
      </div>
      <div class="settings-buttons">
        <button class="btn btn-secondary" onclick="toggleSettings()">Anulează</button>
        <button class="btn btn-primary" onclick="saveSettings()">Salvează</button>
      </div>
    </div>
  </div>

  <script>
    // === Config ===
    const GATEWAY_KEY = 'lola_gateway_url';
    const TOKEN_KEY = 'lola_gateway_token';
    const WAKE_KEY = 'lola_wake_word';
    const TTS_KEY = 'lola_tts_voice';
    
    let gatewayUrl = localStorage.getItem(GATEWAY_KEY) || '';
    let gatewayToken = localStorage.getItem(TOKEN_KEY) || '';
    let wakeWord = localStorage.getItem(WAKE_KEY) || 'hey lola';
    let ttsVoice = localStorage.getItem(TTS_KEY) || 'auto';
    
    // Load settings into UI
    document.getElementById('gateway-url').value = gatewayUrl;
    document.getElementById('gateway-token').value = gatewayToken;
    document.getElementById('wake-word').value = wakeWord;
    document.getElementById('tts-voice').value = ttsVoice;
    
    // === State ===
    let isOn = false;
    let isConnected = false;
    let isListening = false;
    let isThinking = false;
    let isSpeaking = false;
    let recognition = null;
    let wakeRecognition = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let pollTimer = null;
    let lastPollTime = 0;
    
    // === UI Functions ===
    function setStatus(status, text) {
      const badge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      const orb = document.getElementById('voice-orb');
      const voiceStatus = document.getElementById('voice-status');
      
      badge.className = 'status-badge status-' + status;
      statusText.textContent = text;
      
      orb.className = 'voice-orb ' + (status === 'off' ? 'idle' : status);
      voiceStatus.textContent = text === 'DECONECTAT' ? 'Apasă ON pentru a conecta' : text;
    }
    
    function toggleSettings() {
      document.getElementById('settings-panel').classList.toggle('visible');
    }
    
    function saveSettings() {
      gatewayUrl = document.getElementById('gateway-url').value.trim().replace(/\/$/, '');
      gatewayToken = document.getElementById('gateway-token').value.trim();
      wakeWord = document.getElementById('wake-word').value.trim().toLowerCase();
      ttsVoice = document.getElementById('tts-voice').value;
      
      localStorage.setItem(GATEWAY_KEY, gatewayUrl);
      localStorage.setItem(TOKEN_KEY, gatewayToken);
      localStorage.setItem(WAKE_KEY, wakeWord);
      localStorage.setItem(TTS_KEY, ttsVoice);
      
      toggleSettings();
      
      if (isOn) {
        // Reconnect with new settings
        powerOff();
        setTimeout(() => powerOn(), 500);
      }
    }
    
    function addChatBubble(text, sender) {
      const log = document.getElementById('chat-log');
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble ' + (sender === 'user' ? 'user' : 'lola');
      const time = new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
      bubble.innerHTML = text + '<div class="timestamp">' + time + '</div>';
      log.appendChild(bubble);
      log.scrollTop = log.scrollHeight;
      
      // Keep max 20 bubbles
      while (log.children.length > 20) {
        log.removeChild(log.firstChild);
      }
    }
    
    // === Power ON/OFF ===
    async function togglePower() {
      if (isOn) {
        powerOff();
      } else {
        await powerOn();
      }
    }
    
    async function powerOn() {
      if (!gatewayUrl) {
        toggleSettings();
        return;
      }
      
      isOn = true;
      document.getElementById('power-button').classList.add('on');
      document.getElementById('power-label').textContent = 'ON';
      document.getElementById('wake-hint').style.display = 'block';
      
      // Test connection
      setStatus('on', 'CONECTARE...');
      const ok = await testConnection();
      
      if (ok) {
        isConnected = true;
        setStatus('on', 'CONECTAT');
        document.getElementById('wake-hint').classList.add('active');
        startWakeWordDetection();
        startPolling();
      } else {
        setStatus('off', 'DECONECTAT');
        document.getElementById('voice-status').textContent = 'Nu pot conecta la Gateway. Verifică URL și Tailscale.';
        isOn = false;
        document.getElementById('power-button').classList.remove('on');
        document.getElementById('power-label').textContent = 'OFF';
        document.getElementById('wake-hint').style.display = 'none';
      }
    }
    
    function powerOff() {
      isOn = false;
      isConnected = false;
      isListening = false;
      isThinking = false;
      isSpeaking = false;
      
      document.getElementById('power-button').classList.remove('on');
      document.getElementById('power-label').textContent = 'OFF';
      document.getElementById('wake-hint').style.display = 'none';
      document.getElementById('wake-hint').classList.remove('active');
      
      stopWakeWordDetection();
      stopPolling();
      stopListening();
      stopSpeaking();
      
      setStatus('off', 'DECONECTAT');
      
      // Hide transcript/response
      document.getElementById('transcript').classList.remove('visible');
      document.getElementById('response').classList.remove('visible');
    }
    
    // === Connection Test ===
    async function testConnection() {
      try {
        const res = await fetch(`${gatewayUrl}/api/health`, {
          method: 'GET',
          headers: { 'Authorization': `Bearer ${gatewayToken}` },
          signal: AbortSignal.timeout(5000)
        });
        return res.ok;
      } catch (e) {
        // Try without auth
        try {
          const res2 = await fetch(`${gatewayUrl}/`, {
            method: 'GET',
            signal: AbortSignal.timeout(5000)
          });
          return res2.ok;
        } catch (e2) {
          return false;
        }
      }
    }
    
    // === Wake Word Detection ===
    function startWakeWordDetection() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        console.log('SpeechRecognition not available');
        return;
      }
      
      wakeRecognition = new SR();
      wakeRecognition.continuous = true;
      wakeRecognition.interimResults = true;
      wakeRecognition.lang = 'ro-RO';
      
      wakeRecognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript.toLowerCase().trim();
          if (transcript.includes(wakeWord) && !isListening && !isThinking && !isSpeaking) {
            console.log('Wake word detected:', transcript);
            wakeRecognition.stop();
            startListening();
            return;
          }
        }
      };
      
      wakeRecognition.onerror = (e) => {
        console.log('Wake word error:', e.error);
        if (e.error === 'no-speech' || e.error === 'aborted') return;
        // Restart after delay
        if (isOn && !isListening) {
          setTimeout(() => {
            if (isOn && !isListening && !isThinking && !isSpeaking) {
              try { wakeRecognition.start(); } catch(e) {}
            }
          }, 1000);
        }
      };
      
      wakeRecognition.onend = () => {
        // Restart if still on and not actively listening
        if (isOn && !isListening && !isThinking && !isSpeaking) {
          setTimeout(() => {
            try { wakeRecognition.start(); } catch(e) {}
          }, 100);
        }
      };
      
      try {
        wakeRecognition.start();
        console.log('Wake word detection started:', wakeWord);
      } catch(e) {
        console.log('Wake word start error:', e);
      }
    }
    
    function stopWakeWordDetection() {
      if (wakeRecognition) {
        try { wakeRecognition.stop(); } catch(e) {}
        wakeRecognition = null;
      }
    }
    
    // === Listening (after wake word) ===
    function startListening() {
      isListening = true;
      setStatus('listening', 'ASCULT...');
      
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        // Fallback: use MediaRecorder
        startMediaRecording();
        return;
      }
      
      recognition = new SR();
      recognition.lang = 'ro-RO';
      recognition.continuous = false;
      recognition.interimResults = true;
      
      let finalTranscript = '';
      
      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += t;
          } else {
            interim += t;
          }
        }
        
        // Show interim
        const transcriptEl = document.getElementById('transcript');
        transcriptEl.textContent = finalTranscript + interim;
        transcriptEl.classList.add('visible');
      };
      
      recognition.onerror = (e) => {
        console.log('Recognition error:', e.error);
        stopListening();
        if (isOn) startWakeWordDetection();
      };
      
      recognition.onend = () => {
        if (finalTranscript.trim()) {
          addChatBubble(finalTranscript.trim(), 'user');
          sendToGateway(finalTranscript.trim());
        } else {
          stopListening();
          if (isOn) startWakeWordDetection();
        }
      };
      
      try {
        recognition.start();
      } catch(e) {
        console.log('Recognition start error:', e);
        stopListening();
        if (isOn) startWakeWordDetection();
      }
    }
    
    function stopListening() {
      isListening = false;
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
        recognition = null;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try { mediaRecorder.stop(); } catch(e) {}
      }
    }
    
    // === Fallback: Media Recording ===
    async function startMediaRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };
        
        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          stream.getTracks().forEach(t => t.stop());
          
          if (audioBlob.size > 1000) {
            await sendAudioToGateway(audioBlob);
          } else {
            stopListening();
            if (isOn) startWakeWordDetection();
          }
        };
        
        // Auto-stop after 30 seconds
        setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
          }
        }, 30000);
        
        mediaRecorder.start();
      } catch(e) {
        console.log('MediaRecorder error:', e);
        stopListening();
        if (isOn) startWakeWordDetection();
      }
    }
    
    // === Send to Gateway ===
    async function sendToGateway(text) {
      isThinking = true;
      stopListening();
      setStatus('thinking', 'PROCESEZ...');
      
      try {
        const res = await fetch(`${gatewayUrl}/api/voice`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${gatewayToken}`
          },
          body: JSON.stringify({
            text: text,
            session: 'pwa-voice',
            respondWithAudio: true
          }),
          signal: AbortSignal.timeout(60000)
        });
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        const responseText = data.response || data.text || data.message || 'Am primit, dar nu am un răspuns.';
        
        // Show response
        addChatBubble(responseText, 'lola');
        document.getElementById('response-text').textContent = responseText;
        document.getElementById('response').classList.add('visible');
        
        // Speak response
        speakResponse(responseText);
        
      } catch (err) {
        console.log('Gateway error:', err);
        addChatBubble('Eroare: ' + err.message, 'lola');
        setStatus('on', 'CONECTAT');
        isThinking = false;
        if (isOn) startWakeWordDetection();
      }
    }
    
    async function sendAudioToGateway(audioBlob) {
      isThinking = true;
      setStatus('thinking', 'PROCESEZ...');
      
      try {
        const formData = new FormData();
        formData.append('audio', audioBlob, 'voice.webm');
        
        const res = await fetch(`${gatewayUrl}/api/voice`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${gatewayToken}`
          },
          body: formData,
          signal: AbortSignal.timeout(60000)
        });
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        const responseText = data.response || data.text || 'Am prims.';
        
        addChatBubble(responseText, 'lola');
        document.getElementById('response-text').textContent = responseText;
        document.getElementById('response').classList.add('visible');
        
        speakResponse(responseText);
        
      } catch (err) {
        console.log('Audio gateway error:', err);
        addChatBubble('Eroare: ' + err.message, 'lola');
        setStatus('on', 'CONECTAT');
        isThinking = false;
        if (isOn) startWakeWordDetection();
      }
    }
    
    // === TTS (Text-to-Speech) ===
    function speakResponse(text) {
      isSpeaking = true;
      isThinking = false;
      setStatus('speaking', 'VORBESC...');
      
      if ('speechSynthesis' in window) {
        // Cancel any ongoing speech
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        
        // Set language based on preference
        if (ttsVoice === 'auto') {
          utterance.lang = navigator.language || 'ro-RO';
        } else {
          utterance.lang = ttsVoice;
        }
        
        // Try to find a matching voice
        const voices = window.speechSynthesis.getVoices();
        const matchVoice = voices.find(v => v.lang === utterance.lang) ||
                          voices.find(v => v.lang.startsWith(utterance.lang.split('-')[0]));
        if (matchVoice) utterance.voice = matchVoice;
        
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        
        utterance.onend = () => {
          stopSpeaking();
          if (isOn) startWakeWordDetection();
        };
        
        utterance.onerror = (e) => {
          console.log('TTS error:', e);
          stopSpeaking();
          if (isOn) startWakeWordDetection();
        };
        
        window.speechSynthesis.speak(utterance);
      } else {
        // No TTS support
        console.log('Speech synthesis not available');
        stopSpeaking();
        if (isOn) startWakeWordDetection();
      }
    }
    
    function stopSpeaking() {
      isSpeaking = false;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      if (isConnected && !isListening && !isThinking) {
        setStatus('on', 'CONECTAT');
      }
    }
    
    // === Polling for proactive messages ===
    function startPolling() {
      stopPolling();
      lastPollTime = Date.now();
      pollTimer = setInterval(async () => {
        if (!isOn || isListening || isThinking || isSpeaking) return;
        
        try {
          const res = await fetch(`${gatewayUrl}/api/voice/poll?since=${lastPollTime}`, {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${gatewayToken}` },
            signal: AbortSignal.timeout(10000)
          });
          
          if (res.ok) {
            const data = await res.json();
            if (data.messages && data.messages.length > 0) {
              for (const msg of data.messages) {
                addChatBubble(msg.text, 'lola');
                speakResponse(msg.text);
              }
            }
          }
          lastPollTime = Date.now();
        } catch (e) {
          // Silent fail
        }
      }, 15000); // Poll every 15 seconds
    }
    
    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }
    
    // === Service Worker Registration ===
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(e => console.log('SW error:', e));
    }
    
    // === Initialize ===
    if (!gatewayUrl) {
      // First run - show settings
      toggleSettings();
    }
    
    // Load voices for TTS
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        console.log('Voices loaded:', window.speechSynthesis.getVoices().length);
      };
    }
  </script>
</body>

<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>🧭 Lola Voice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a1628; --card: #142844; --accent: #ff6b35;
      --accent-glow: rgba(255,107,53,0.3); --green: #4caf50;
      --red: #f44336; --blue: #2196f3; --text: #e8e8e8;
      --text-dim: #8a8a8a; --border: #1e3a5f;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh; height: 100dvh; overflow: hidden; position: fixed; width: 100%;
      display: flex; flex-direction: column;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 12px; background: var(--card);
      border-bottom: 1px solid var(--border); flex: 0 0 auto;
    }
    .header-title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; }
    .status-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase;
    }
    .status-off { background: rgba(244,67,54,0.2); color: var(--red); border: 1px solid var(--red); }
    .status-on { background: rgba(76,175,80,0.2); color: var(--green); border: 1px solid var(--green); animation: pulse-green 2s infinite; }
    .status-listening { background: rgba(255,107,53,0.2); color: var(--accent); border: 1px solid var(--accent); animation: pulse-orange 1s infinite; }
    .status-thinking { background: rgba(33,150,243,0.2); color: var(--blue); border: 1px solid var(--blue); }
    .status-speaking { background: rgba(33,150,243,0.2); color: var(--blue); border: 1px solid var(--blue); animation: pulse-blue 1s infinite; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    @keyframes pulse-green { 0%,100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); } 50% { box-shadow: 0 0 0 8px rgba(76,175,80,0); } }
    @keyframes pulse-orange { 0%,100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.4); } 50% { box-shadow: 0 0 0 12px rgba(255,107,53,0); } }
    @keyframes pulse-blue { 0%,100% { box-shadow: 0 0 0 0 rgba(33,150,243,0.4); } 50% { box-shadow: 0 0 0 8px rgba(33,150,243,0); } }
    .voice-orb { border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid; transition: all 0.3s; cursor: pointer; }
    .voice-orb.idle { border-color: var(--text-dim); }
    .voice-orb.listening { border-color: var(--accent); background: rgba(255,107,53,0.1); box-shadow: 0 0 40px var(--accent-glow); animation: orb-pulse 1.5s infinite; }
    .voice-orb.thinking { border-color: var(--blue); background: rgba(33,150,243,0.1); box-shadow: 0 0 30px rgba(33,150,243,0.3); }
    .voice-orb.speaking { border-color: var(--blue); background: rgba(33,150,243,0.1); box-shadow: 0 0 30px rgba(33,150,243,0.3); animation: orb-pulse 1s infinite; }
    .voice-orb.on { border-color: var(--green); background: rgba(76,175,80,0.1); }
    .voice-orb.waking { border-color: var(--green); background: rgba(76,175,80,0.2); box-shadow: 0 0 30px rgba(76,175,80,0.4); animation: orb-pulse 1s infinite; }
    @keyframes orb-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .voice-status-text { font-size: 12px; color: var(--text-dim); text-align: center; min-height: 16px; }
    .voice-transcript {
      width: 100%; padding: 4px 12px; background: var(--card);
      border: 1px solid var(--border); font-size: 13px;
      line-height: 1.4; display: none; max-height: 60px; overflow-y: auto; flex: 0 0 auto;
    }
    .voice-transcript.visible { display: block; }
    .voice-response {
      width: 100%; padding: 4px 12px; background: rgba(33,150,243,0.1);
      border: 1px solid var(--blue); font-size: 13px;
      line-height: 1.4; display: none; max-height: 80px; overflow-y: auto; flex: 0 0 auto;
    }
    .voice-response.visible { display: block; }
    .response-label { font-size: 11px; color: var(--blue); margin-bottom: 4px; font-weight: 600; }
    .chat-log {
      width: 100%; flex: 1 1 auto; overflow-y: auto; padding: 8px 16px;
      display: flex; flex-direction: column; gap: 8px; min-height: 100px !important;
      background: rgba(255,255,255,0.02);
    }
    .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; animation: slide-in 0.3s ease; word-wrap: break-word; }
    @keyframes slide-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .chat-bubble.user { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
    .chat-bubble.lola { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .chat-bubble .timestamp { font-size: 10px; opacity: 0.6; margin-top: 4px; }
    .chat-bubble.pending { align-self: flex-end; background: rgba(255,165,0,0.15); color: #ffa500; border: 1px dashed #ffa500; border-bottom-right-radius: 4px; }
    .chat-bubble.pending .timestamp::after { content: ' \23F3 PENDING'; color: #ffa500; font-weight: 600; }
    .settings-panel {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; padding: 20px;
    }
    .settings-panel.visible { display: flex; }
    .settings-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; }
    .settings-card h2 { font-size: 20px; margin-bottom: 16px; }
    .settings-field { margin-bottom: 16px; }
    .settings-field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
    .settings-field input, .settings-field select { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; }
    .settings-field input:focus { outline: none; border-color: var(--accent); }
    .settings-buttons { display: flex; gap: 12px; margin-top: 20px; }
    .btn { flex: 1; padding: 10px 16px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .settings-icon { cursor: pointer; font-size: 20px; opacity: 0.7; }
    .power-bar { padding: 4px 12px; flex: 0 0 auto; }
    .power-bar-button {
      padding: 6px 14px; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .power-bar-button.off { background: rgba(244,67,54,0.15); color: var(--red); border: 1px solid var(--red); }
    .power-bar-button.on { background: rgba(76,175,80,0.2); color: var(--green); border: 1px solid var(--green); box-shadow: 0 0 15px rgba(76,175,80,0.2); }
    .power-bar-button:active { transform: scale(0.98); }
    .wake-hint { font-size: 11px; color: var(--text-dim); text-align: center; padding: 2px 6px; background: rgba(255,255,255,0.05); border-radius: 6px; max-width: 95%; }
    .wake-hint.active { color: var(--green); background: rgba(76,175,80,0.1); }
    .wake-hint.listening { color: var(--accent); background: rgba(255,107,53,0.1); }
    .debug-log { font-size: 10px; color: var(--text-dim); padding: 2px 12px; max-height: 40px; overflow-y: auto; flex: 0 0 auto; }
    .mode-toggle { display: flex; gap: 4px; padding: 4px 12px; flex: 0 0 auto; }
    .mode-btn { padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 11px; cursor: pointer; background: transparent; color: var(--text-dim); }
    .mode-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">🧭 Lola Voice <span style="font-size:10px; color:var(--text-dim); font-weight:400;">v6.2</span></div>
    <div class="status-badge status-off" id="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">DECONECTAT</span>
    </div>
    <div class="settings-icon" onclick="toggleSettings()">⚙️</div>
  </div>

  <div class="power-bar" style="display:flex; align-items:center; gap:8px; padding:4px 12px;">
    <button class="power-bar-button off" id="power-button" onclick="togglePower()" style="width:auto; flex:0 0 auto; padding:6px 14px;">⏻ OFF</button>
    <div class="voice-orb idle" id="voice-orb" style="width:32px; height:32px; font-size:16px; border-width:2px; flex-shrink:0;">🧭</div>
    <div class="voice-status-text" id="voice-status" style="flex:1; text-align:left; font-size:11px;">Apasă ON</div>
    <div class="wake-hint" id="wake-hint" style="display:none; flex:0 0 auto; max-width:none; padding:2px 8px; font-size:10px;">Spune "Hey Lola"</div>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="mode-wake" onclick="setMode('wake')">Wake Word</button>
    <button class="mode-btn" id="mode-continuous" onclick="setMode('continuous')">Conversație</button>
    <button class="mode-btn" id="mode-push" onclick="setMode('push')">Push-to-Talk</button>
  </div>

  <div class="voice-transcript" id="transcript" style="padding:4px 12px; max-height:40px;"></div>
  <div class="voice-response" id="response" style="padding:4px 12px; max-height:50px;">
    <div class="response-label" style="font-size:10px;">🧭 LOLA:</div>
    <div id="response-text" style="font-size:12px;"></div>
  </div>

  <div class="chat-log" id="chat-log" style="min-height:50vh;"></div>

  <div class="debug-log" id="debug-log"></div>

  <div class="text-input-bar" style="display:flex; gap:8px; padding:6px 12px; background:var(--card); border-top:1px solid var(--border); flex-shrink:0;">
    <input type="text" id="text-input" placeholder="Scrie mesaj..." style="flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:8px 12px; color:var(--text); font-size:14px; outline:none;">
    <button id="text-send" onclick="sendTextMessage()" style="background:var(--accent); color:#fff; border:none; border-radius:10px; padding:8px 14px; font-size:14px; cursor:pointer; font-weight:600; flex-shrink:0;">➤</button>
  </div>

  <div class="settings-panel" id="settings-panel">
    <div class="settings-card">
      <h2>⚙️ Setări</h2>
      <div class="settings-field">
        <label for="server-url">Server URL (Tailscale)</label>
        <input type="url" id="server-url" placeholder="http://100.77.8.15:18790">
      </div>
      <div class="settings-field">
        <label for="wake-word">Wake Word</label>
        <input type="text" id="wake-word" value="hey lola">
      </div>
      <div class="settings-field">
        <label for="tts-voice">Voce Răspuns (TTS)</label>
        <select id="tts-voice">
          <option value="auto">Auto (limba telefonului)</option>
          <option value="ro-RO">Română</option>
          <option value="it-IT">Italiană</option>
        </select>
      </div>
      <div class="settings-field">
        <label for="tts-engine">Motor TTS</label>
        <select id="tts-engine">
          <option value="edge">Edge TTS (natural, online)</option>
          <option value="browser">Browser (speechSynthesis, offline)</option>
        </select>
      </div>
      <div class="settings-field">
        <label for="silence-delay">Tăcere = sfârșit (sec)</label>
        <input type="number" id="silence-delay" value="2" min="1" max="5" step="0.5">
      </div>
      <div class="settings-buttons">
        <button class="btn btn-secondary" onclick="toggleSettings()">Anulează</button>
        <button class="btn btn-primary" onclick="saveSettings()">Salvează</button>
      </div>
    </div>
  </div>

  <script>
    
// Anti-loop: detect repetitive garbage from Chrome SpeechRecognition
function isRepetitiveGarbage(text) {
  if (!text || text.length < 10) return false;
  const words = text.trim().toLowerCase().split(/\s+/);
  if (words.length < 4) return false;
  // Check if same word repeats 3+ times
  const counts = {};
  words.forEach(w => counts[w] = (counts[w]||0) + 1);
  const maxRepeat = Math.max(...Object.values(counts));
  if (maxRepeat >= 3 && words.length <= 12) return true;
  // Check if short phrase repeats (e.g. "fosta fost un mesaj" x3)
  for (let len = 2; len <= 5; len++) {
    const phrase = words.slice(0, len).join(' ');
    let reps = 1;
    for (let i = len; i + len <= words.length; i += len) {
      if (words.slice(i, i+len).join(' ') === phrase) reps++;
      else break;
    }
    if (reps >= 3) return true;
  }
  return false;
}

// === v6.0 Config — Direct Ollama Server (no Gateway WebSocket) ===
    const SERVER_KEY = 'lola_server_url';
    const WAKE_KEY = 'lola_wake_word';
    const TTS_KEY = 'lola_tts_voice';
    const TTS_ENGINE_KEY = 'lola_tts_engine';
    const SILENCE_KEY = 'lola_silence_delay';
    const MODE_KEY = 'lola_mode';

    let serverUrl = localStorage.getItem(SERVER_KEY) || 'http://100.77.8.15:18790';
    let wakeWord = localStorage.getItem(WAKE_KEY) || 'hey lola';
    let ttsVoice = localStorage.getItem(TTS_KEY) || 'auto';
    let ttsEngine = localStorage.getItem(TTS_ENGINE_KEY) || 'edge';
    let silenceDelay = parseFloat(localStorage.getItem(SILENCE_KEY) || '2');
    let chatMode = localStorage.getItem(MODE_KEY) || 'wake'; // wake | continuous | push

    document.getElementById('server-url').value = serverUrl;
    document.getElementById('wake-word').value = wakeWord;
    document.getElementById('tts-voice').value = ttsVoice;
    document.getElementById('tts-engine').value = ttsEngine;
    document.getElementById('silence-delay').value = silenceDelay;
    updateModeButtons();

    // === State ===
    let isOn = false, isConnected = false, isListening = false, isThinking = false, isSpeaking = false;
    let isWakeListening = false;
    let ttsActive = false; // v6.1 — blochează microfonul în timp ce TTS vorbește (anti feedback loop)
    let wakeRecognition = null;
    let wakeRestartTimer = null;
    let wakeRestartCount = 0;
    let mediaRecorder = null;
    let audioChunks = [];
    let mediaStream = null;
    let recordingTimer = null;
    let continuousRecognition = null;
    let silenceTimer = null;
    let lastSpeechTime = 0;
    let isPushing = false;

    // === Debug log ===
    function dbg(msg) {
      console.log('[LolaVoice] ' + msg);
      const el = document.getElementById('debug-log');
      if (el) {
        const time = new Date().toLocaleTimeString('ro-RO', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
        el.textContent = time + ' ' + msg;
      }
    }

    // === UI ===
    function setStatus(status, text) {
      const badge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      const orb = document.getElementById('voice-orb');
      const voiceStatus = document.getElementById('voice-status');
      badge.className = 'status-badge status-' + status;
      statusText.textContent = text;
      orb.className = 'voice-orb ' + (status === 'off' ? 'idle' : status);
      voiceStatus.textContent = text === 'DECONECTAT' ? 'Apasă ON pentru a conecta' : text;
    }

    function toggleSettings() { document.getElementById('settings-panel').classList.toggle('visible'); }

    function saveSettings() {
      serverUrl = document.getElementById('server-url').value.trim().replace(/\/$/, '');
      wakeWord = document.getElementById('wake-word').value.trim().toLowerCase();
      ttsVoice = document.getElementById('tts-voice').value;
      ttsEngine = document.getElementById('tts-engine').value;
      silenceDelay = parseFloat(document.getElementById('silence-delay').value) || 2;
      localStorage.setItem(SERVER_KEY, serverUrl);
      localStorage.setItem(WAKE_KEY, wakeWord);
      localStorage.setItem(TTS_KEY, ttsVoice);
      localStorage.setItem(TTS_ENGINE_KEY, ttsEngine);
      localStorage.setItem(SILENCE_KEY, silenceDelay);
      toggleSettings();
      document.getElementById('voice-status').textContent = 'Salvat: Server=' + (serverUrl ? 'OK' : 'GOL');
      if (isOn) { powerOff(); setTimeout(() => powerOn(), 500); }
    }

    function setMode(mode) {
      chatMode = mode;
      localStorage.setItem(MODE_KEY, mode);
      updateModeButtons();
      if (isOn) { powerOff(); setTimeout(() => powerOn(), 500); }
    }

    function updateModeButtons() {
      ['wake', 'continuous', 'push'].forEach(m => {
        const btn = document.getElementById('mode-' + m);
        if (btn) btn.classList.toggle('active', chatMode === m);
      });
    }

    function addChatBubble(text, sender) {
      const log = document.getElementById('chat-log');
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble ' + (sender === 'user' ? 'user' : 'lola');
      const time = new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
      bubble.innerHTML = escapeHtml(text) + '<div class="timestamp">' + time + '</div>';
      log.appendChild(bubble);
      log.scrollTop = log.scrollHeight;
      while (log.children.length > 50) log.removeChild(log.firstChild);
      return bubble;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // === Power ===
    async function togglePower() { if (isOn) powerOff(); else await powerOn(); }

    async function powerOn() {
      serverUrl = localStorage.getItem(SERVER_KEY) || serverUrl;
      if (!serverUrl) {
        document.getElementById('voice-status').textContent = 'EROARE: Server URL lipsește!';
        toggleSettings();
        return;
      }
      isOn = true;
      document.getElementById('power-button').classList.add('on');
      document.getElementById('power-button').classList.remove('off');
      document.getElementById('power-button').textContent = '⏻ ON';
      document.getElementById('wake-hint').style.display = 'block';
      setStatus('on', 'CONECTARE...');

      // Health check
      try {
        const resp = await fetch(serverUrl + '/health', { signal: AbortSignal.timeout(5000) });
        const data = await resp.json();
        if (data.status === 'ok') {
          isConnected = true;
          setStatus('on', 'CONECTAT');
          dbg('Server OK: model=' + data.model);
          startListening();
        } else {
          throw new Error('Health check failed');
        }
      } catch (e) {
        isConnected = false;
        setStatus('off', 'SERVER INACCESIBIL');
        dbg('Server err: ' + e.message);
        // Retry în 3s
        setTimeout(() => { if (isOn) powerOn(); }, 3000);
      }
    }

    function powerOff() {
      isOn = false; isConnected = false; isListening = false; isThinking = false; isSpeaking = false;
      isWakeListening = false; isPushing = false;
      document.getElementById('power-button').classList.remove('on');
      document.getElementById('power-button').classList.add('off');
      document.getElementById('power-button').textContent = '⏻ OFF';
      document.getElementById('wake-hint').style.display = 'none';
      document.getElementById('wake-hint').classList.remove('active', 'listening');
      stopWakeWord();
      stopContinuous();
      stopRecording();
      stopSpeaking();
      setStatus('off', 'DECONECTAT');
      document.getElementById('transcript').classList.remove('visible');
      document.getElementById('response').classList.remove('visible');
    }

    function startListening() {
      if (chatMode === 'wake') startWakeWord();
      else if (chatMode === 'continuous') startContinuous();
      // push mode — ascultă doar la apăsare
    }

    // ==========================================
    // === CHAT — Direct Ollama Server (HTTP) ===
    // ==========================================
    async function if (isRepetitiveGarbage(text)) { dbg('Anti-loop: ignorat text repetitiv'); } else sendToServer(text) {
      isThinking = true;
      stopListening();
      setStatus('thinking', 'PROCESEZ...');
      streamedText = '';

      const transcriptEl = document.getElementById('transcript');
      transcriptEl.textContent = '🎤 ' + text;
      transcriptEl.classList.add('visible');

      const bubble = addChatBubble(text, 'user');
      bubble.classList.add('pending');

      try {
        dbg('Trimitem: ' + text.substring(0, 60));
        const resp = await fetch(serverUrl + '/chat', { 
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
          signal: AbortSignal.timeout(60000)
        });

        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        bubble.classList.remove('pending');

        let reply = data.reply || '';
        dbg('Răspuns: ' + reply.substring(0, 60));

        if (reply && reply.trim() !== 'NO_REPLY') {
          addChatBubble(reply, 'lola');
          document.getElementById('response-text').textContent = reply;
          document.getElementById('response').classList.add('visible');
          isThinking = false;
          speakResponse(reply);
        } else {
          isThinking = false;
          if (isConnected) setStatus('on', 'CONECTAT');
          restartListening();
        }
      } catch (e) {
        bubble.classList.remove('pending');
        isThinking = false;
        dbg('Chat err: ' + e.message);
        addChatBubble('⚠️ Eroare: ' + e.message, 'lola');
        if (isConnected) setStatus('on', 'CONECTAT');
        restartListening();
      }
    }

    function sendTextMessage() {
      const input = document.getElementById('text-input');
      const text = input.value.trim();
      if (!text || !isConnected) return;
      input.value = '';
      if (isRepetitiveGarbage(text)) { dbg('Anti-loop: ignorat text repetitiv'); } else sendToServer(text);
    }
    document.addEventListener('DOMContentLoaded', function() {
      const ti = document.getElementById('text-input');
      if (ti) ti.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendTextMessage(); });
    });

    function stopListening() {
      stopWakeWord();
      stopContinuous();
      stopRecording();
    }

    function restartListening() {
      if (isOn && isConnected && !ttsActive) {
        if (chatMode === 'wake') { wakeRestartCount = 0; setTimeout(startWakeWord, 300); }
        else if (chatMode === 'continuous') { setTimeout(startContinuous, 300); }
      }
    }

    // ==========================================
    // === MODE 1: WAKE WORD (SpeechRecognition) ===
    // ==========================================
    function startWakeWord() {
      if (isWakeListening || isListening || isThinking || isSpeaking || ttsActive) return;
      if (chatMode !== 'wake') return;
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { dbg('SpeechRecognition nu există'); return; }

      try { wakeRecognition = new SR(); } catch(e) { dbg('SR create err: ' + e.message); return; }

      wakeRecognition.continuous = true;
      wakeRecognition.interimResults = true;
      wakeRecognition.lang = 'ro-RO';
      wakeRecognition.maxAlternatives = 3;

      wakeRecognition.onstart = () => {
        isWakeListening = true; wakeRestartCount = 0;
        dbg('WAKE pornit — ascult "Hey Lola"');
        document.getElementById('voice-orb').className = 'voice-orb on';
        const hint = document.getElementById('wake-hint');
        hint.classList.add('active'); hint.classList.remove('listening');
        hint.textContent = 'Spune "Hey Lola"';
      };

      wakeRecognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          let transcript = event.results[i][0].transcript.toLowerCase().trim();
          const variants = [wakeWord, 'hei lola', 'hai lola', 'he lola', 'ei lola', 'heila', 'hej lola'];
          let matched = false;
          for (const v of variants) { if (transcript.includes(v)) { matched = true; break; } }
          if (matched && !isListening && !isThinking && !isSpeaking) {
            dbg('WAKE detectată: "' + transcript + '"');
            stopWakeWord();
            if (navigator.vibrate) navigator.vibrate(100);
            startRecording();
            return;
          }
        }
      };

      wakeRecognition.onerror = (e) => {
        dbg('WAKE err: ' + e.error);
        if (e.error === 'not-allowed') {
          document.getElementById('voice-status').textContent = '⚠️ Microfon blocat';
          return;
        }
      };

      wakeRecognition.onend = () => {
        isWakeListening = false;
        dbg('WAKE ended (count=' + wakeRestartCount + ')');
        if (isOn && !isListening && !isThinking && !isSpeaking && chatMode === 'wake') {
          const delay = Math.min(100 * Math.pow(1.3, wakeRestartCount), 1000);
          wakeRestartCount++;
          if (wakeRestartTimer) clearTimeout(wakeRestartTimer);
          wakeRestartTimer = setTimeout(() => {
            if (isOn && !isListening && !isThinking && !isSpeaking && !isWakeListening && chatMode === 'wake') {
              try { wakeRecognition.start(); } catch(e) { dbg('WAKE restart err: ' + e.message); }
            }
          }, delay);
        }
      };

      try { wakeRecognition.start(); dbg('WAKE start...'); }
      catch(e) {
        dbg('WAKE start err: ' + e.message);
        if (wakeRestartTimer) clearTimeout(wakeRestartTimer);
        wakeRestartTimer = setTimeout(() => { if (isOn) startWakeWord(); }, 500);
      }
    }

    function stopWakeWord() {
      isWakeListening = false;
      if (wakeRestartTimer) { clearTimeout(wakeRestartTimer); wakeRestartTimer = null; }
      if (wakeRecognition) {
        try { wakeRecognition.onend = null; wakeRecognition.onerror = null; wakeRecognition.onresult = null; wakeRecognition.stop(); } catch(e){}
        wakeRecognition = null;
      }
    }

    // ==========================================
    // === MODE 2: CONTINUOUS CONVERSATION ===
    // ==========================================
    // SpeechRecognition cu continuous=true, interimResults=true
    // Detectează tăcerea (silenceDelay sec) → trimite textul la server
    // După răspuns TTS → repornește ascultarea automat

    function startContinuous() {
      if (isListening || isThinking || isSpeaking || ttsActive) return;
      if (chatMode !== 'continuous') return;
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { dbg('SpeechRecognition nu există'); return; }

      try { continuousRecognition = new SR(); } catch(e) { return; }

      continuousRecognition.continuous = true;
      continuousRecognition.interimResults = true;
      continuousRecognition.lang = 'ro-RO';
      continuousRecognition.maxAlternatives = 1;

      let finalTranscript = '';

      continuousRecognition.onstart = () => {
        isListening = true;
        finalTranscript = '';
        setStatus('listening', 'ASCULT...');
        dbg('CONTINUOUS pornit');
        const hint = document.getElementById('wake-hint');
        if (hint) { hint.classList.add('listening'); hint.textContent = '🔊 Vorbește...'; }
      };

      continuousRecognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
            lastSpeechTime = Date.now();
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        const display = finalTranscript + interim;
        const transcriptEl = document.getElementById('transcript');
        transcriptEl.textContent = '🎤 ' + display;
        transcriptEl.classList.add('visible');

        // Detect silence — dacă avem text și tăcere > silenceDelay sec → trimite
        if (finalTranscript.trim() || interim.trim()) {
          lastSpeechTime = Date.now();
          if (silenceTimer) clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            const text = (finalTranscript + ' ' + interim).trim();
            if (text && isListening && !isThinking && !isSpeaking) {
              dbg('Silence detected — sending: ' + text.substring(0, 60));
              stopContinuous();
              if (isRepetitiveGarbage(text)) { dbg('Anti-loop: ignorat text repetitiv'); } else sendToServer(text);
            }
          }, silenceDelay * 1000);
        }
      };

      continuousRecognition.onerror = (e) => {
        dbg('CONTINUOUS err: ' + e.error);
        if (e.error === 'not-allowed') {
          document.getElementById('voice-status').textContent = '⚠️ Microfon blocat';
          return;
        }
      };

      continuousRecognition.onend = () => {
        isListening = false;
        dbg('CONTINUOUS ended');
        // Dacă avem text netrimis, trimite-l
        if (finalTranscript.trim() && !isThinking && !isSpeaking) {
          stopContinuous();
          if (isRepetitiveGarbage(finalTranscript.trim())) { dbg('Anti-loop: ignorat text repetitiv'); } else sendToServer(finalTranscript.trim());
        } else if (isOn && isConnected && !isThinking && !isSpeaking && !ttsActive && chatMode === 'continuous') {
          // Repornire automată — doar dacă TTS nu e activ
          setTimeout(() => { if (isOn && !isThinking && !isSpeaking && !ttsActive && chatMode === 'continuous') startContinuous(); }, 300);
        }
      };

      try { continuousRecognition.start(); }
      catch(e) { dbg('CONTINUOUS start err: ' + e.message); }
    }

    function stopContinuous() {
      if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
      if (continuousRecognition) {
        try { continuousRecognition.onend = null; continuousRecognition.onerror = null; continuousRecognition.onresult = null; continuousRecognition.stop(); } catch(e){}
        continuousRecognition = null;
      }
      isListening = false;
    }

    // ==========================================
    // === MODE 3: PUSH-TO-TALK (tap and hold) ===
    // ==========================================
    // Apasă și ține orb-ul → înregistrează. Release → trimite.

    function startPushToTalk() {
      if (isListening || isThinking || isSpeaking) return;
      isPushing = true;
      startRecording();
    }

    function stopPushToTalk() {
      if (!isPushing) return;
      isPushing = false;
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    // ==========================================
    // === RECORDING (MediaRecorder + Groq Whisper via server) ===
    // ==========================================
    // Pentru wake mode: după wake word → înregistrează → trimite audio la server
    // Server face Whisper transcriere + Ollama response în unul singur

    async function startRecording() {
      if (ttsActive) return; // v6.1 — nu înregistra în timp ce TTS vorbește
      isListening = true;
      setStatus('listening', 'ASCULT...');
      const hint = document.getElementById('wake-hint');
      if (hint) { hint.classList.remove('active'); hint.classList.add('listening'); hint.textContent = '🔊 Vorbește...'; }
      dbg('REC start');

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];

        let mimeType = 'audio/webm;codecs=opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/webm';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';

        mediaRecorder = new MediaRecorder(mediaStream, mimeType ? { mimeType } : {});
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

        mediaRecorder.onstop = async () => {
          dbg('REC stop');
          const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }

          if (audioBlob.size < 500) {
            dbg('Audio prea mic — ignor');
            isListening = false;
            restartListening();
            return;
          }

          // Trimite audio la server pentru Whisper + Ollama
          const transcriptEl = document.getElementById('transcript');
          transcriptEl.textContent = '🔄 Transcriu + procesez...';
          transcriptEl.classList.add('visible');

          isThinking = true;
          isListening = false;
          setStatus('thinking', 'PROCESEZ...');

          try {
            const reader = new FileReader();
            reader.onloadend = async () => {
              const base64 = reader.result.split(',')[1];
              const dataSizeKB = Math.round(base64.length * 0.75 / 1024);
              dbg('Audio: ' + dataSizeKB + 'KB → server');

              // Trimite ca audio la server
              try {
                const resp = await fetch(serverUrl + '/audio', { 
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    audio: base64,
                    mimeType: mediaRecorder.mimeType || 'audio/webm'
                  }),
                  signal: AbortSignal.timeout(90000)
                });

                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();

                if (data.transcript) {
                  transcriptEl.textContent = '🎤 ' + data.transcript;
                  addChatBubble(data.transcript, 'user');
                }

                if (data.reply && data.reply.trim() !== 'NO_REPLY') {
                  addChatBubble(data.reply, 'lola');
                  document.getElementById('response-text').textContent = data.reply;
                  document.getElementById('response').classList.add('visible');
                  isThinking = false;
                  speakResponse(data.reply);
                } else {
                  isThinking = false;
                  if (isConnected) setStatus('on', 'CONECTAT');
                  restartListening();
                }
              } catch (e) {
                isThinking = false;
                dbg('Audio chat err: ' + e.message);
                addChatBubble('⚠️ Eroare: ' + e.message, 'lola');
                if (isConnected) setStatus('on', 'CONECTAT');
                restartListening();
              }
            };
            reader.readAsDataURL(audioBlob);
          } catch (e) {
            isThinking = false;
            dbg('FileReader err: ' + e.message);
            restartListening();
          }
        };

        recordingTimer = setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            dbg('REC timeout 15s');
            mediaRecorder.stop();
          }
        }, 15000);

        mediaRecorder.start();
        dbg('REC pornit OK');

        const orb = document.getElementById('voice-orb');
        orb.onclick = () => {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            dbg('REC stop manual');
            mediaRecorder.stop();
          }
        };
      } catch(e) {
        dbg('REC err: ' + e.message);
        document.getElementById('voice-status').textContent = '⚠️ Microfon: ' + e.message;
        isListening = false;
        restartListening();
      }
    }

    function stopRecording() {
      if (recordingTimer) { clearTimeout(recordingTimer); recordingTimer = null; }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try { mediaRecorder.stop(); } catch(e){}
      }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      isListening = false;
    }

    // ==========================================
    // === TTS (Edge TTS + speechSynthesis fallback) ===
    // ==========================================
    let edgeTtsAudio = null;
    let edgeTtsWs = null;

    function speakResponse(text) {
      isSpeaking = true; isThinking = false;
      ttsActive = true; // v6.1 — blochează microfonul
      // Oprește orice recunoaștere vocală activă
      stopWakeWord();
      stopContinuous();
      setStatus('speaking', 'VORBESC...');
      dbg('TTS: "' + text.substring(0, 50) + (text.length > 50 ? '...' : '') + '"');
      if (ttsEngine === 'edge') speakEdgeTts(text);
      else fallbackTts(text);
    }

    async function speakEdgeTts(text) {
      const voiceMap = {
        'ro-RO': 'ro-RO-EmilNeural',
        'it-IT': 'it-IT-DiegoNeural',
        'auto': (navigator.language || 'ro-RO').startsWith('it') ? 'it-IT-DiegoNeural' : 'ro-RO-EmilNeural'
      };
      const voice = voiceMap[ttsVoice] || voiceMap['auto'];
      const lang = voice.split('-').slice(0, 2).join('-');

      try {
        const wsUrl = 'wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=6A5AA1D4EAFF4E9FB37E23D68491D6F4';
        edgeTtsWs = new WebSocket(wsUrl);
        let audioChunks = [];

        edgeTtsWs.binaryType = 'arraybuffer';

        edgeTtsWs.onopen = () => {
          dbg('Edge TTS conectat — voice=' + voice);
          const config = 'Content-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n{"context":{"synthesis":{"audio":{"metadataoptions":{"sentenceBoundaryEnabled":"false","wordBoundaryEnabled":"false"},"outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}';
          edgeTtsWs.send(config);
          const ssml = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="' + lang + '"><voice name="' + voice + '"><prosody rate="+5%" pitch="+0%">' + text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</prosody></voice></speak>';
          const msg = 'X-RequestId:' + (crypto.randomUUID ? crypto.randomUUID() : 'r' + (++rpcCounter)) + '\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:' + new Date().toISOString() + 'Z\r\nPath:ssml\r\n\r\n' + ssml;
          edgeTtsWs.send(msg);
        };

        edgeTtsWs.onmessage = (event) => {
          if (event.data instanceof ArrayBuffer) {
            if (event.data.byteLength > 2) {
              const audioData = event.data.slice(2);
              if (audioData.byteLength > 0) audioChunks.push(audioData);
            }
          } else if (typeof event.data === 'string') {
            if (event.data.includes('Path:turn.end')) {
              dbg('Edge TTS gata — ' + audioChunks.length + ' chunks');
              try { edgeTtsWs.close(); } catch(e){}
              if (audioChunks.length > 0) {
                const blob = new Blob(audioChunks, { type: 'audio/mp3' });
                const url = URL.createObjectURL(blob);
                edgeTtsAudio = new Audio(url);
                edgeTtsAudio.onended = () => {
                  URL.revokeObjectURL(url); edgeTtsAudio = null; stopSpeaking(); restartListening();
                };
                edgeTtsAudio.onerror = () => { URL.revokeObjectURL(url); edgeTtsAudio = null; fallbackTts(text); };
                edgeTtsAudio.play().catch(() => fallbackTts(text));
              } else { fallbackTts(text); }
            }
          }
        };

        edgeTtsWs.onerror = () => { try { edgeTtsWs.close(); } catch(e){} fallbackTts(text); };
        edgeTtsWs.onclose = () => {};

        setTimeout(() => {
          if (isSpeaking && audioChunks.length === 0 && edgeTtsWs && edgeTtsWs.readyState === WebSocket.OPEN) {
            try { edgeTtsWs.close(); } catch(e){}
            fallbackTts(text);
          }
        }, 10000);

      } catch(e) { fallbackTts(text); }
    }

    function fallbackTts(text) {
      dbg('TTS fallback — speechSynthesis');
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = ttsVoice === 'auto' ? (navigator.language || 'ro-RO') : ttsVoice;
        const voices = window.speechSynthesis.getVoices();
        const matchVoice = voices.find(v => v.lang === utterance.lang) || voices.find(v => v.lang.startsWith(utterance.lang.split('-')[0]));
        if (matchVoice) utterance.voice = matchVoice;
        utterance.rate = 1.05; utterance.pitch = 1.0;
        utterance.onend = () => { stopSpeaking(); restartListening(); };
        utterance.onerror = () => { stopSpeaking(); restartListening(); };
        window.speechSynthesis.speak(utterance);
      } else {
        stopSpeaking(); restartListening();
      }
    }

    function stopSpeaking() {
      isSpeaking = false;
      ttsActive = false; // v6.1 — deblochează microfonul
      if (edgeTtsAudio) { try { edgeTtsAudio.pause(); edgeTtsAudio = null; } catch(e){} }
      if (edgeTtsWs) { try { edgeTtsWs.onmessage = null; edgeTtsWs.close(); } catch(e){} edgeTtsWs = null; }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (isConnected && !isListening && !isThinking) setStatus('on', 'CONECTAT');
    }

    // === Orb events for Push-to-Talk ===
    document.addEventListener('DOMContentLoaded', function() {
      const orb = document.getElementById('voice-orb');
      if (orb) {
        orb.addEventListener('touchstart', (e) => {
          if (chatMode === 'push' && isOn && !isListening && !isThinking && !isSpeaking) {
            e.preventDefault(); startPushToTalk();
          }
        });
        orb.addEventListener('touchend', (e) => {
          if (chatMode === 'push' && isPushing) { e.preventDefault(); stopPushToTalk(); }
        });
        orb.addEventListener('mousedown', () => {
          if (chatMode === 'push' && isOn && !isListening && !isThinking && !isSpeaking) startPushToTalk();
        });
        orb.addEventListener('mouseup', () => { if (chatMode === 'push' && isPushing) stopPushToTalk(); });
      }
    });

    // === Service Worker ===
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(e => dbg('SW err: ' + e));
    }

    // === Init ===
    if (!serverUrl) toggleSettings();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => dbg('Voices: ' + window.speechSynthesis.getVoices().length);
      window.speechSynthesis.getVoices();
    }
  </script>
</body>
